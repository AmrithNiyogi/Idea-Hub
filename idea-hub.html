:root{
  --font-sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono','JetBrains Mono',monospace;

  /* Cool blue-gray canvas — subtle tint, not strong blue / not purple */
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --surface-3:#E4E8EF;
  --border:rgba(30,41,59,.1); --border-strong:rgba(30,41,59,.2);
  --text:#1E1B4B; --text-2:rgba(30,27,75,.78); --text-3:rgba(30,27,75,.62);
  --overlay:rgba(10,10,11,.45);

  --brand:#6B3DC9; --brand-hover:#522A6F; --brand-ink:#6B3DC9; --brand-soft:#F2EFFC; --brand-line:#E4DCFA; --on-brand:#FFFFFF;
  --accent:#8B5CF6; --btn-bg:#0A0A0B; --btn-fg:#FFFFFF;
  --gold:#E5B423; --gold-ink:#8A6300; --gold-soft:#FFF9E5;
  --success:#15803D; --success-soft:#E7F6EC;
  --warning:#8A6300; --warning-soft:#FEF1C2;
  --danger:#DC2626;  --danger-soft:#FDECEC;
  --info:#6B3DC9;    --info-soft:#F4ECFF;
  --neutral-soft:#E8ECF2;
  --cat-tech:#4F46E5; --cat-business:#D9A514; --cat-process:#6B6B70; --cat-innovation:#8B5CF6;
  --av-1:#6B3DC9; --av-2:#4F46E5; --av-3:#522A6F; --av-4:#8A6300; --av-5:#2A2A2C; --av-6:#8B5CF6; --av-7:#2D1640; --av-8:#6B6B70;
  /* Derived for modules added after the design file (extra category colours, chart series); same official ramps. */
  --cat-amber:#8A6300; --cat-green:#15803D; --cat-violet:#522A6F; --cat-coral:#DC2626;
  --chart-1:#8B5CF6; --chart-2:#E5B423; --chart-3:#4F46E5; --chart-4:#522A6F; --chart-5:#8A6300; --chart-6:#6B6B70;

  --agent-bg:linear-gradient(rgba(139,92,246,.06),rgba(139,92,246,.06));
  --agent-border:#E4DCFA; --agent-glow:0 0 0 3px rgba(139,92,246,.14);

  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --shadow-1:0 2px 6px rgba(15,23,42,.06);
  --shadow-2:0 18px 40px rgba(15,23,42,.12);
  --focus:0 0 0 2px #8B5CF6;
  --ease-out:cubic-bezier(0.16,1,0.3,1);

  --sidebar-w:244px; --sidebar-w-collapsed:64px; --topbar-h:58px;
  --fs-eyebrow:11px; --fs-small:13px; --fs-body:14px; --fs-h3:17px; --fs-h2:20px; --fs-h1:28px; --fs-kpi:30px;
  color-scheme:light;
}
[data-theme="dark"]{
  /* Cool violet-slate stack — layered canvas / elevated / tertiary (not flat black) */
  --bg:#0B0A10; --surface:#14131B; --surface-2:#1C1B25; --surface-3:#2A2834;
  --border:rgba(220,214,255,.12); --border-strong:rgba(220,214,255,.22);
  --text:#F3F1FA; --text-2:rgba(243,241,250,.84); --text-3:rgba(243,241,250,.68);
  --overlay:rgba(5,4,10,.65);
  --brand:#8B5CF6; --brand-hover:#7C4DE8; --brand-ink:#C4B0F8; --brand-soft:rgba(139,92,246,.2); --brand-line:rgba(167,139,250,.42); --on-brand:#FFFFFF;
  --accent:#A78BFA; --btn-bg:#F3F1FA; --btn-fg:#0B0A10;
  --gold:#F0C84A; --gold-ink:#F0C84A; --gold-soft:rgba(240,200,74,.14);
  --success:#4ADE80; --success-soft:rgba(22,163,74,.2);
  --warning:#F0C84A; --warning-soft:rgba(240,200,74,.14);
  --danger:#F87171;  --danger-soft:rgba(220,38,38,.22);
  --info:#818CF8;    --info-soft:rgba(79,70,229,.24);
  --neutral-soft:#2A2834;
  --cat-tech:#818CF8; --cat-business:#F0C84A; --cat-process:#A8A8AE; --cat-innovation:#B794F6;
  --av-1:#6B3DC9; --av-2:#4F46E5; --av-3:#522A6F; --av-4:#8A6300; --av-5:#2A2A2C; --av-6:#8B5CF6; --av-7:#6B6B70; --av-8:#3F3F46;
  --cat-amber:#E5B423; --cat-green:#4ADE80; --cat-violet:#E6D5FF; --cat-coral:#F87171;
  --chart-1:#8B5CF6; --chart-2:#F0C84A; --chart-3:#818CF8; --chart-4:#B794F6; --chart-5:#D9A514; --chart-6:#A8A8AE;
  --agent-bg:linear-gradient(rgba(139,92,246,.1),rgba(139,92,246,.1));
  --agent-border:rgba(167,139,250,.35); --agent-glow:0 0 0 3px rgba(139,92,246,.16);
  --shadow-1:0 1px 2px rgba(0,0,0,.45),0 0 0 1px rgba(220,214,255,.05);
  --shadow-2:0 16px 40px rgba(0,0,0,.5);
  --focus:0 0 0 2px #A78BFA;
  color-scheme:dark;
}
/* ==== END SECTION C1 ==== */

/* ==== SECTION C2 BASE AND LAYOUT ==== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-h) + 16px)}   /* anchored and focused elements never hide under the sticky topbar */
body{margin:0;font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-wrap:anywhere}
/* long unbroken text (titles, tags, labels, pasted URLs) wraps instead of widening the page; flex and grid children may shrink */
.row>*,.listrow>*,.card__head>*,.meta-row>*,.chip-row>*,.feed li>*,.attn>*,.idea-card__foot>*,.timeline__item>*,.comment>*,.notif>*,.search__item>*,.person>*{min-width:0}
.main,.view,.stack,.stack>*,.layout-rail>*,.cards>*,.grid>*,.board__col,.board__list,.agent,.agent__body,.decision,.quote,.notice>*,.nextstep,.trace,.trace summary>*,.similar,.sugg>*,.dl>*{min-width:0}
.agent p,.agent li,.agent .quote,.trace__step>*,.notice,.nextstep,.decision,.similar{overflow-wrap:anywhere}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600;letter-spacing:-.01em}
h1{font-size:var(--fs-h1)} h2{font-size:var(--fs-h2)} h3{font-size:var(--fs-h3)} h4{font-size:var(--fs-body)}
p{margin:0}
a{color:var(--brand-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
ul,ol{margin:0;padding:0;list-style:none}
img,svg{max-width:100%}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);outline:2px solid transparent;border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--on-brand);padding:8px 12px;border-radius:var(--radius-sm);z-index:100}
.skip:focus{left:8px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)} .small{font-size:var(--fs-small)} .strong{font-weight:600}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.app.is-collapsed{grid-template-columns:var(--sidebar-w-collapsed) minmax(0,1fr)}
.main{min-width:0;display:flex;flex-direction:column}
.view{padding:var(--space-5) var(--space-6) var(--space-8);max-width:1480px;width:100%;margin:0 auto;min-width:0;outline:none}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:var(--space-4) var(--space-3);gap:var(--space-4);z-index:40;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.brand__mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand__text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand__word{font-weight:600;letter-spacing:-.02em}
.brand__sub{font-size:11px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav__label{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--radius-md);color:var(--text-2);font-weight:500;text-decoration:none;position:relative;min-height:40px}
.nav-item:hover{background:var(--surface-2);text-decoration:none;color:var(--text)}
.nav-item[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
.nav-item__badge{margin-left:auto;font-family:var(--font-mono);font-size:11px;background:var(--danger);color:#fff;border-radius:var(--radius-pill);padding:1px 7px}
.nav-item svg{flex:none}
.sidebar__foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--border)}
.sidebar__note{font-size:11px;color:var(--text-3);padding:0 8px}
.scrim{display:none}

.topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-6);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
@supports not (background:color-mix(in srgb,red,blue)){.topbar{background:var(--bg)}}
.topbar__title{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--text-3)}
.crumbs a{color:var(--text-3);white-space:nowrap;flex:none}
.crumbs svg{flex:none} .crumbs a:hover{color:var(--text)}
.crumbs [aria-current]{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{position:relative;flex:0 1 360px;min-width:0}
.search__input{width:100%;height:36px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-pill);padding:0 36px 0 36px;color:var(--text);font:inherit}
.search__icon{position:absolute;left:11px;top:9px;color:var(--text-3);pointer-events:none}
.search__kbd{position:absolute;right:10px;top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:18px}
.search__results{overflow-x:hidden;position:absolute;left:0;right:0;top:42px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:6px;max-height:70vh;overflow:auto;z-index:50;min-width:280px}
.search__group{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);padding:8px 8px 4px}
.search__item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:var(--radius-sm);color:var(--text);text-decoration:none;min-width:0}
.search__item .grow{min-width:0}
.search__field{position:relative;flex:1 1 auto;min-width:0}
.search .search__close{display:none}
#search-btn{display:none}
.search__item:hover,.search__item:focus{background:var(--surface-2);text-decoration:none}
.topbar__actions{display:flex;align-items:center;gap:8px;flex:none}
.topbar__cta{height:34px;padding:0 14px 0 12px;gap:7px;font-weight:600;letter-spacing:.01em;box-shadow:0 1px 0 color-mix(in srgb,var(--btn-bg) 35%,transparent)}
.topbar__cta:hover{box-shadow:none}
.topbar__cta-label{line-height:1}
.role-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-pill);background:var(--gold-soft);color:var(--gold-ink);font-size:12px;font-weight:600;white-space:nowrap;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.popover{position:fixed;top:calc(var(--topbar-h) - 2px);right:var(--space-5);width:min(380px,calc(100vw - 24px));max-height:calc(100vh - var(--topbar-h) - 20px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);z-index:60}
.popover__head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.banner{display:flex;gap:12px;align-items:center;padding:10px var(--space-5);background:var(--warning-soft);color:var(--warning);border-bottom:1px solid var(--border);font-size:13px}
.banner .btn{margin-left:auto}
/* ==== END SECTION C2 ==== */

/* ==== SECTION C3 COMPONENTS ==== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:500;white-space:nowrap;text-decoration:none;line-height:1}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn--primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn--primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn--ghost{border-color:transparent;background:transparent}
.btn--danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn--danger:hover{background:var(--danger);filter:brightness(.92)}
.btn--sm{height:30px;padding:0 10px;font-size:13px}
.btn--icon{width:36px;padding:0}
.btn--block{width:100%}
.btn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.btn .count{font-family:var(--font-mono);font-size:12px}
.icon{flex:none;vertical-align:middle}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:var(--space-5);min-width:0}
.card--flush{padding:0}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-bottom:var(--space-4)}
.card__head h2,.card__head h3{overflow-wrap:break-word;min-width:0}
.card--tight{padding:var(--space-4)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--text-3);margin-bottom:var(--space-3)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--border)}
.eyebrow--plain::after{display:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-5);flex-wrap:wrap}
.page-head h1{margin-top:2px}
.page-head p{color:var(--text-2);margin-top:6px;max-width:68ch}
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.stack--sm{gap:var(--space-2)} .stack--lg{gap:var(--space-5)}
.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.row--between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.grid{display:grid;gap:var(--space-4)}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi-row--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.layout-rail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--space-5);align-items:start}
.layout-rail--wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.sticky{position:sticky;top:calc(var(--topbar-h) + 16px)}

.pill{display:inline-flex;align-items:center;gap:6px;min-height:22px;max-width:100%;padding:0 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--text-2)}
.pill--brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill--info{background:var(--info-soft);color:var(--info)}
.pill--success{background:var(--success-soft);color:var(--success)}
.pill--warning{background:var(--warning-soft);color:var(--warning)}
.pill--danger{background:var(--danger-soft);color:var(--danger)}
.pill--gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill--agent{background:var(--brand-soft);color:var(--brand-ink);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;min-height:20px;border:1px solid var(--agent-border)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;min-height:22px;max-width:100%;padding:1px 8px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-2);font-size:12px;border:1px solid var(--border);overflow-wrap:anywhere;word-break:break-word;line-height:1.35}
a.tag:hover{background:var(--surface-3);text-decoration:none}
.tag--removable{gap:6px;padding-right:4px}
.tag button{border:0;background:transparent;padding:0 4px;color:var(--text-3);height:18px;line-height:1;border-radius:4px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.suggest-chip{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--brand-line);background:var(--brand-soft);color:var(--brand-ink);border-radius:var(--radius-pill);padding:2px 4px 2px 10px;font-size:12.5px}
.suggest-chip button{border:0;background:transparent;color:inherit;height:22px;padding:0 6px;border-radius:var(--radius-pill);font-weight:600;font-size:12px}
.suggest-chip button:hover{background:var(--surface);}

.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none;letter-spacing:.02em}
.avatar--lg{width:64px;height:64px;font-size:22px}
.avatar--sm{width:22px;height:22px;font-size:9.5px}
.avatar--anon{background:var(--surface-3)!important;color:var(--text-3)}
.person{display:inline-flex;align-items:center;gap:8px;min-width:0;color:var(--text);font-weight:500}
.person:hover{text-decoration:none;color:var(--brand-ink)}
.avatar-stack{display:inline-flex}
.avatar-stack .avatar{margin-left:-6px;border:2px solid var(--surface)}
.avatar-stack .avatar:first-child{margin-left:0}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .label{font-weight:600;font-size:13px}
.field .hint{font-size:var(--fs-small);color:var(--text-3)}
.field .error{font-size:var(--fs-small);color:var(--danger);font-weight:500}
.field .error:empty{display:none}
.input,.select,.textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:var(--radius-md);padding:8px 12px;font:inherit;min-height:38px}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:var(--focus)}
.input[aria-invalid="true"],.textarea[aria-invalid="true"],.select[aria-invalid="true"]{border-color:var(--danger)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch__track{width:38px;height:22px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;transition:background .15s;margin-top:1px}
.switch__track::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .switch__track{background:var(--brand)}
.switch input:checked + .switch__track::after{transform:translateX(16px)}
.switch input:focus-visible + .switch__track{box-shadow:var(--focus)}
.segmented{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
.segmented label{position:relative;cursor:pointer}
.segmented input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.segmented span{display:grid;place-items:center;min-width:40px;height:34px;padding:0 12px;font-weight:600;border-left:1px solid var(--border)}
.segmented label:first-child span{border-left:0}
.segmented input:checked + span{background:var(--brand);color:var(--on-brand)}
.segmented input:focus-visible + span{box-shadow:inset var(--focus)}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.radio-card{position:relative;display:block;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:12px 14px;background:var(--surface);cursor:pointer}
.radio-card input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.radio-card:has(input:checked){border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.radio-card:has(input:focus-visible){box-shadow:var(--focus)}
.radio-card__title{font-weight:600;display:flex;gap:8px;align-items:center}
.radio-card__desc{font-size:var(--fs-small);color:var(--text-3);margin-top:4px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:var(--space-5);overflow-x:auto;scrollbar-width:none}
.tabs a,.tabs button{padding:10px 14px;color:var(--text-2);font-weight:500;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.tabs a:hover{color:var(--text);text-decoration:none}
.tabs [aria-selected="true"],.tabs [aria-current="page"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.tabs .count{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border-radius:99px;padding:1px 7px;color:var(--text-2)}

.kpi{display:flex;flex-direction:column;gap:4px;padding:var(--space-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);color:var(--text);text-decoration:none;min-width:0;position:relative}
a.kpi:hover{border-color:var(--brand-line);text-decoration:none;box-shadow:0 0 0 3px var(--brand-soft)}
.kpi__label{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:600}
.kpi__value{font-family:var(--font-mono);font-size:var(--fs-kpi);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.kpi__sub{font-size:var(--fs-small);color:var(--text-3)}
.kpi--accent .kpi__value{color:var(--brand-ink)}

.table-wrap{position:relative;overflow-x:auto;max-width:100%;min-width:0}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:var(--surface-2)}
.table .title-cell{min-width:240px;max-width:420px;font-weight:600}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.step{position:relative;padding:0 8px 0 0;min-width:0}
.step::before{content:"";position:absolute;top:13px;left:28px;right:0;height:2px;background:var(--border-strong)}
.step:last-child::before{display:none}
.step--done::before{background:var(--brand)}
.step__dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1;font-size:12px;font-weight:700;color:var(--text-3)}
.step--done .step__dot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.step--current .step__dot{border-color:var(--brand);color:var(--brand-ink);box-shadow:var(--agent-glow);background:var(--brand-soft)}
.step--bad .step__dot{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.step--paused .step__dot{border-color:var(--warning);color:var(--warning);background:var(--warning-soft)}
.step__label{margin-top:8px;font-weight:600;font-size:13px}
.step__meta{font-size:12px;color:var(--text-3);margin-top:2px}
.step--future .step__label{color:var(--text-3)}

.agent{background:var(--agent-bg),var(--surface);border:1px solid var(--agent-border);border-left:3px solid var(--brand);border-radius:var(--radius-lg);padding:var(--space-4);min-width:0}
.agent__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-3)}
.agent__name{font-weight:600;color:var(--brand-ink)}
.agent__kind{font-size:11px;color:var(--text-3);margin-left:auto;font-family:var(--font-mono)}
.agent__body{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.agent__foot{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px dashed var(--agent-border);font-size:11.5px;color:var(--text-3)}
.agent--thinking{box-shadow:var(--agent-glow)}
.agent h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:4px}
.agent ul.bullets{list-style:disc;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.quote{border-left:2px solid var(--border-strong);padding-left:10px;color:var(--text-2);font-size:13px}
.quote cite{display:block;font-style:normal;font-size:12px;color:var(--text-3)}
.skeleton{display:flex;flex-direction:column;gap:8px}
.skeleton i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.trace{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.trace summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.trace summary::-webkit-details-marker{display:none}
.trace summary::before{content:"\25B8";color:var(--text-3);transition:transform .15s}
.trace[open] summary::before{transform:rotate(90deg)}
.trace__steps{padding:0 12px 12px 28px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.trace__step{display:grid;grid-template-columns:86px 1fr auto;gap:10px;font-size:13px}
.trace__kind{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-ink)}

.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.timeline__item{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:var(--space-4);position:relative}
.timeline__item::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--border)}
.timeline__item:last-child::before{display:none}
.timeline__dot{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--text-2)}
.timeline__dot--agent{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--agent-border)}
.timeline__dot--bad{background:var(--danger-soft);color:var(--danger)}
.timeline__dot--good{background:var(--success-soft);color:var(--success)}
.timeline__when{font-size:12px;color:var(--text-3)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:var(--space-7) var(--space-5);color:var(--text-2)}
.empty .icon{color:var(--text-3)}
.empty h3{color:var(--text)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-md);background:var(--info-soft);color:var(--text);font-size:13px;align-items:flex-start}
.notice--warn{background:var(--warning-soft)}
.notice--danger{background:var(--danger-soft)}
.notice--ok{background:var(--success-soft)}
.notice--brand{background:var(--brand-soft)}
.notice .icon{margin-top:2px}
.divider{height:1px;background:var(--border);margin:var(--space-4) 0;border:0}
.meter{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--brand);border-radius:99px}

.modal-backdrop{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--border)}
.modal__head{padding:18px 20px 0}
.modal__body{padding:12px 20px 4px;display:flex;flex-direction:column;gap:var(--space-4)}
.modal__foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px 20px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-2);font-size:13.5px;display:flex;gap:10px;align-items:center;max-width:420px}
.toast--error{background:var(--danger);color:#fff}
.toast--ok .icon{color:#7BE3B5}
/* ==== END SECTION C3 ==== */

/* ==== SECTION C4 MODULE STYLES ==== */
/* -- shell widgets -- */
.notif{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}
.notif:hover{background:var(--surface-2);text-decoration:none}
.notif__dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:transparent}
.notif--unread .notif__dot{background:var(--brand)}
.notif__text{display:block;font-size:13.5px}
.persona-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border:0;background:none;border-bottom:1px solid var(--border)}
.persona-item:hover{background:var(--surface-2)}
.persona-item[aria-current="true"]{background:var(--brand-soft)}
/* -- idea cards, charts, lists -- */
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:var(--space-4)}
.idea-card{display:flex;flex-direction:column;gap:10px}
.idea-card__title{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.idea-card__title a{color:var(--text)}
.idea-card__foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px}
.stagebar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.stagebar span{background:var(--brand);display:block;min-width:6px}
.stagebar__legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin-top:12px}
.stagebar__legend li{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.stagebar__legend li i{width:10px;height:10px;border-radius:3px;background:var(--brand);flex:none}
.stagebar__lab{flex:1 1 auto;min-width:0;color:var(--text-2)}
.funnel{display:flex;flex-direction:column;gap:10px;min-width:0;margin-bottom:14px}
.funnel__row{display:grid;grid-template-columns:minmax(84px,104px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.funnel__lab{color:var(--text-2);min-width:0}
.funnel__track{height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:block}
.funnel__track i{display:block;height:100%;background:var(--brand);border-radius:6px}
.funnel__val{text-align:right;font-size:13px}
.kpi-also{margin-top:var(--space-3)}

.listrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:var(--space-4)}

.hbar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:6px 0}

/* -- idea detail -- */
.comment{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}

.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 16px}

.nextstep{border-left:3px solid var(--brand);background:var(--surface-2);border-radius:var(--radius-md);padding:12px 14px}

.idea-title{overflow-wrap:anywhere;margin:10px 0 12px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-bottom:var(--space-4);color:var(--text-2);font-size:13px}
.decision{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;background:var(--surface)}
.decision blockquote{margin:10px 0 0;padding-left:12px;border-left:2px solid var(--border-strong);color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}

/* -- submit -- */
.sf-section{display:flex;flex-direction:column;gap:var(--space-4)}
.sf-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4)}
.similar{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.similar__pct{font-family:var(--font-mono);font-weight:600;color:var(--brand-ink);background:var(--brand-soft);border-radius:var(--radius-sm);padding:1px 7px}
.checklist li{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.checklist .ok{color:var(--success)} .checklist .todo{color:var(--text-3)}
.sf-details>summary{cursor:pointer;font-weight:600;padding:2px 0 10px;list-style:none;display:flex;gap:8px;align-items:center}
.sf-details>summary::-webkit-details-marker{display:none}
.sugg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--agent-border);font-size:13px}
.sugg:last-child{border-bottom:0}
.sugg__btns{display:flex;gap:4px;flex:none}
.attach-row{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:end}
@media (max-width:1100px){.layout-rail--submit aside{order:-1}.layout-rail--submit aside.sticky{position:static}}
@media (max-width:760px){.sf-grid2{grid-template-columns:1fr}.attach-row{grid-template-columns:1fr}}
.profile-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
/* -- review and pipeline -- */
.chip-link{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-weight:500;text-decoration:none;white-space:nowrap}
.chip-link:hover{background:var(--surface-2);text-decoration:none}
.chip-link[aria-current="true"]{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.chip-link .count{font-family:var(--font-mono);font-size:11px}
.rv-right{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}   /* no inner scroll: the whole page scrolls */
.layout-rail--review{grid-template-columns:minmax(0,1.2fr) minmax(360px,1fr)}
@media (max-width:1100px){.layout-rail--review{grid-template-columns:minmax(0,1fr)}}
.score-row>div:first-child{min-width:0;overflow-wrap:break-word}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.score-row:last-of-type{border-bottom:0}
.score-row .segmented span{min-width:34px;height:32px;padding:0 8px}
.decision-fields{display:flex;flex-direction:column;gap:var(--space-3);padding:12px;border-radius:var(--radius-md);background:var(--surface-2)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--space-3);align-items:start;padding-bottom:6px}
.board-cue{display:none;align-items:center;gap:6px;margin:0 0 8px;font-size:var(--fs-small)}
@media (max-width:1199px) and (min-width:761px){.board{grid-auto-columns:minmax(240px,1fr);overflow-x:auto;scroll-snap-type:x proximity;box-shadow:inset -18px 0 14px -14px rgba(0,0,0,.18)}.board__col{scroll-snap-align:start}.board-cue{display:flex}}
.board__col{background:var(--surface-2);border-radius:var(--radius-lg);padding:10px;min-height:120px;min-width:0}
.board__head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-weight:600}
.board__list{display:flex;flex-direction:column;gap:8px;max-height:680px;overflow-y:auto}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:6px;color:var(--text);text-decoration:none}
.pcard:hover{border-color:var(--brand-line);text-decoration:none}
.pcard__title{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;line-height:1.3}
.pcard .row{min-width:0}
.pcard .pill{white-space:normal;line-height:1.3;padding-top:2px;padding-bottom:2px}
.pcard--stuck{border-left:3px solid var(--danger)}
.pcard--muted{opacity:.78}
@media (max-width:760px){
  .board{grid-auto-flow:row;grid-auto-columns:auto;overflow-x:visible}
  .board__list{max-height:none}
  .table--cards thead{display:none}
  .table--cards,.table--cards tbody,.table--cards tr,.table--cards td{display:block;width:100%}
  .table--cards tr{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;padding:8px 4px}
  .table--cards td{border:0;padding:6px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .table--cards td::before{content:attr(data-label);color:var(--text-3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .table--cards .title-cell{display:block}
  .table--cards .title-cell::before{display:block;margin-bottom:2px}
}
/*@@INSERT_CSS_MODULES@@*/
.modal--wide{width:min(780px,100%)}

.dv-row__act{flex:0 0 auto}

.inline-form .field{min-width:0}
.imp-row{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}

.share-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:start}

.dv-section{margin-top:var(--space-5)}

.ann{padding:12px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}

.upd{overflow-wrap:anywhere;word-break:break-word}

/* ==== SECTION C4.5 PHASE 5 STYLES (ideathons, recognition, profiles) ==== */
.pts{font-family:var(--font-mono);font-weight:700;color:var(--gold-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--gold-soft);color:var(--gold-ink);font-weight:700;font-family:var(--font-mono);font-size:13px;white-space:nowrap}
.bd{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-3);min-width:96px}

.winner-banner{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;gap:var(--space-4);align-items:flex-start}

.award-card{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;gap:var(--space-3);align-items:flex-start;min-width:0}
.award-card .winner-ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold);color:#241800;display:grid;place-items:center}

.escrow{border:1px dashed var(--gold);background:var(--gold-soft);border-radius:var(--radius-lg);padding:var(--space-4)}
.tally{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr);gap:8px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}

.tally__bars{display:flex;flex-direction:column;gap:5px;min-width:0}
.tally__bar{display:grid;grid-template-columns:74px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--text-2)}

.tally__bar--c .meter>i{background:var(--gold)}
.tally__bar--a .meter>i{background:var(--cat-business)}
.timer{font-family:var(--font-mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.timer--low{color:var(--danger)}
.score-btns{display:flex;flex-wrap:wrap;gap:4px}
.score-btns .btn{min-width:36px;padding:0 8px}

.pitch-card__head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pitch-no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-mono)}
.cluster{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3)}

.ith-card{display:flex;flex-direction:column;gap:10px;min-width:0}
.ith-card h3{overflow-wrap:anywhere}

.sl-row{display:grid;grid-template-columns:28px 34px minmax(0,1fr) 64px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)}

.sl-row input[type=checkbox]{width:18px;height:18px;margin-top:3px}
.ledger-row{display:grid;grid-template-columns:70px 64px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}

.badge-card--earned .badge-ic{background:var(--gold);color:#241800}
.helpful-pill{margin-left:4px}
.step--gold .step__dot{background:var(--gold);border-color:var(--gold);color:#241800}
.step--gold::before{background:var(--gold)}
.prog{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.ph5-two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--space-5);align-items:start}

.ins-toolbar{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;justify-content:space-between;margin-bottom:var(--space-4)}

.ins-item{padding:12px 0;border-top:1px solid var(--border)}

.crit-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 90px;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--border)}
.rule-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--border)}
.num-in{max-width:120px}
.audit-ch{margin:4px 0 0;padding-left:18px;font-size:var(--fs-small);color:var(--text-2)}

.preview{padding:12px 14px;border-radius:var(--radius-md);background:var(--brand-soft);font-size:13px}

.flow li:last-child::after{display:none}
.flow li.is-agent{background:var(--brand-soft);border-color:var(--brand-line)}

/* ==== END SECTION C4.6 ==== */

.rb{display:block}.rb-row{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin:8px 0;background:var(--surface-2)}.rb-row--fixed{background:var(--surface)}

.signin__legend-title{margin:0 0 4px;font-size:14px;font-weight:600}
.signin__legend-intro{margin:0 0 var(--space-3)}
.signin__legend-list{display:grid;gap:10px;margin:0}
.signin__legend-row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:var(--space-3);align-items:start}

.signin__foot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-5);border-top:1px solid var(--border)}

.role-chip__btn{border:0;background:none;color:inherit;font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:2px;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:transparent}
.role-chip__btn:hover{text-decoration-color:currentColor}
.role-chip__btn:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-sm)}
.rolestrip{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:stretch}
.rolestrip__item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;min-width:0;max-width:100%}
.rolestrip__item:hover{border-color:var(--brand);background:var(--brand-soft)}
@media (max-width:820px){.signin__cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.signin__cards{grid-template-columns:minmax(0,1fr)}.signin__main{padding:0 var(--space-4) var(--space-5)}.signin__legend-row{grid-template-columns:minmax(0,1fr)}}
/* ==== END SECTION C4.10 ==== */

/* ==== SECTION C5 RESPONSIVE ==== */
@media (max-width:1280px){
  .layout-rail{grid-template-columns:minmax(0,1fr) 300px}

}
@media (max-width:1100px){
  .app,.app.is-collapsed{grid-template-columns:var(--sidebar-w-collapsed) minmax(0,1fr)}

  .topbar{padding:0 var(--space-5)}
  #collapse-btn{display:none}
}
@media (max-width:760px){
  .app,.app.is-collapsed{grid-template-columns:minmax(0,1fr)}

  .app.drawer-open .sidebar{transform:none}
  .app.drawer-open .brand__text,.app.drawer-open .nav-item__text,.app.drawer-open .nav__label,.app.drawer-open .sidebar__note,.app.drawer-open .sidebar .btn__text{display:revert}

  .app.drawer-open .scrim{display:block}
  .topbar{padding:0 12px;gap:8px}
  .search{flex:1 1 auto}
  .search__kbd,.role-chip__text-long{display:none}
  .topbar__cta{width:34px;padding:0;gap:0}
  .topbar__cta-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .view{padding:var(--space-4) 14px var(--space-7)}
  .grid-2,.grid-3,.grid-5{grid-template-columns:minmax(0,1fr)}

}
@media (min-width:761px){#mobile-menu{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.dv-grid{grid-template-columns:minmax(0,1fr)}.imp-row{grid-template-columns:minmax(0,1fr)}.share-row{grid-template-columns:minmax(0,1fr) 90px}}
/* ==== END SECTION C5 ==== */
/* Sidebar branding: product name at the top, Dotkonnekt logo at the bottom. */
.brand__glyph{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand__name{font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.brand__sub{margin-top:3px;letter-spacing:.14em;text-transform:uppercase;font-size:10px}
.dk-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 2px;color:var(--text)}

.app.is-collapsed .dk-logo__word{display:none}
@media (max-width:1100px){.dk-logo{justify-content:center;padding:6px 0 2px}.dk-logo__word{display:none}}
@media (max-width:760px){.app.drawer-open .dk-logo{justify-content:flex-start;padding:6px 8px 2px}.app.drawer-open .dk-logo__word{display:block}}
/* Desktop collapsed sidebar: icons only (the collapse toggle previously narrowed the column without hiding labels). */
@media (min-width:1101px){
  .app.is-collapsed .sidebar{padding:var(--space-4) 10px}
  .app.is-collapsed .brand__text,.app.is-collapsed .nav-item__text,.app.is-collapsed .nav__label,.app.is-collapsed .sidebar__note,.app.is-collapsed .sidebar .btn__text{display:none}

}

   st:'parked', sub:-60, pk:-58, dec:{ o:'parked', by:'nina', d:-52, sc:[3,4,4], r:'Valuable but it depends on the new cluster budget being approved. We would rather revisit once the infrastructure plan is final than start it half funded.', rev:-5 } },
 { k:'cronfleet', c:'tech', a:'marcus', co:[], eff:'XL', tags:['automation','observability'], t:'Replace the cron fleet with a scheduler service',
   p:'About 70 cron jobs run on three shared servers with no central view of failures. Two silent job failures last quarter delayed billing exports.',
   s:'Replace the cron fleet with a managed scheduler service that gives every job retries, alerts and an owner.',
   b:'Platform and finance operations teams.', m:'All jobs with an owner and an alert; no silent failures in a quarter.',
   st:'declined', sub:-75, pk:-73, dec:{ o:'declined', by:'elena', d:-62, sc:[3,5,3], r:'The problem is real, but a full replacement is a very large migration for a small number of failures. Adding alerting to the existing jobs would solve most of the pain at a fraction of the effort.', cm:'A proposal that starts with alerts and ownership for the top 15 jobs, with evidence that alerting alone cannot meet the reliability target, would be reviewed again.' } },
 { k:'promptreg', c:'tech', a:'aiko', co:['wen'], eff:'M', tags:['agents','testing'], t:'Prompt regression suite for agent templates',
   p:'Agent templates are edited by many teams, and a small wording change can break behaviour that customers depend on. We only find out from support tickets.',
   s:'A regression suite that replays a fixed set of prompts and expected behaviours against every template change and reports differences before merge.',
   b:'Teams that maintain agent templates (about 15 engineers) and customers who rely on stable behaviour.', m:'Template regressions reaching customers down from 6 per quarter to 1.',
   st:'prototype', sub:-45, pk:-44, dec:{ o:'accepted', by:'nina', d:-36, sc:[5,3,5], r:'Directly protects customer experience and fits the agent quality theme. Aiko already has a working harness.', own:'omar', h:50 }, proto:-30,
   del:{ hg:50, hl:27, tasks:[['Collect 200 golden prompts',1],['Build replay harness',1],['CI gate on template changes',0],['Report differences in PR comments',0]], up:[[-9,'aiko','Harness replays 180 prompts in 7 minutes. Working on stable scoring for free-text answers.'],[-3,'wen','Golden set now covers the five most-used templates.']] } },

 { k:'quote', c:'business', a:'jess', co:[], eff:'M', tags:['pricing','sales-enablement'], t:'Usage-based quote calculator for sales',
   p:'Sales reps build usage-based quotes in personal spreadsheets, so two reps quoting the same customer can differ by 15 percent. Deals have been delayed while finance re-checks the maths.',
   s:'A shared quote calculator that applies the published usage tiers, flags discounts above policy and exports a quote ready for the CRM.',
   b:'Account executives and sales engineers (about 25), and finance, who currently re-check every quote.', m:'Quote turnaround from 2 days to 4 hours; zero quotes needing finance corrections.',
   st:'under_review', sub:-9, pk:-8 },
 { k:'renewal', c:'business', a:'grace', co:[], eff:'L', tags:['analytics','customer-feedback'], t:'Renewal-risk score in the CRM',
   p:'Account managers learn about at-risk renewals when the customer says they are leaving. Usage and support signals exist but live in three different tools.',
   s:'Compute a renewal-risk score from usage trends, support sentiment and contract data, show it in the CRM account view and list the top drivers behind each score.',
   b:'Account managers and customer success managers (about 20), and leadership who forecast renewals.', m:'At-risk accounts identified 60 days before renewal for 80 percent of churned accounts.',
   st:'accepted', sub:-22, pk:-21, dec:{ o:'accepted', by:'ravi', d:-9, sc:[5,4,5], r:'Strongest revenue case in this quarter’s queue. The data sources are available; what is missing is an engineering owner and a decision on who maintains the scoring model.', own:null, h:80 } },
 { k:'partner', c:'business', a:'victor', co:[], eff:'M', tags:['partners','sales-enablement'], t:'Partner co-marketing playbook',
   p:'Partners run co-marketing campaigns ad hoc and each one asks us for different assets. Campaigns take an average of seven weeks to launch.',
   s:'Write a partner co-marketing playbook with reusable assets, a launch checklist and a joint-metrics template, tested with two partners.',
   b:'Partner managers, marketing, and partners who want faster launches.', m:'Co-marketing launch time from 7 weeks to 3; at least 4 partner campaigns using the playbook within six months.',
   st:'under_review', sub:-4, pk:-3 },
 { k:'onepagers', c:'business', a:'farid', co:[], eff:'S', tags:['sales-enablement','docs'], t:'Industry one-pagers built from case studies',
   p:'Sales engineers rewrite the same industry stories for every pitch, and the case studies live in long PDFs nobody reads before a call.',
   s:'Turn the 24 published case studies into one-page industry summaries with a problem, a result and the relevant Kompass features, kept in one shared library.',
   b:'Sales and solutions engineers, and prospects who want a quick relevant example.', m:'Prep time per pitch down by 2 hours; one-pagers used in 60 percent of first calls.',
   st:'implemented', sub:-100, pk:-98, dec:{ o:'accepted', by:'kofi', d:-90, sc:[3,1,4], r:'Low effort, immediate use for the sales team, and no engineering dependency.', own:'theo', h:25 }, proto:-88, impl:-60,
   del:{ hg:25, hl:21, tasks:[['Pick the 12 strongest case studies',1],['Write and review one-pagers',1],['Publish shared library',1]], up:[[-75,'farid','Eight one-pagers reviewed by sales.'],[-60,'farid','All 12 published. Library link added to the sales handbook.']], imp:{ h:18, usd:0, conf:'Medium', note:'Survey of 14 reps; hours per month estimated from reported prep time saved.' }, contrib:['farid','victor','pia'] } },
 { k:'onbpkg', c:'business', a:'yara', co:['chloe'], eff:'M', tags:['onboarding','pricing'], t:'Tiered onboarding packages for mid-market customers',
   p:'Mid-market customers all get the same onboarding, which is too much for small teams and too little for regulated ones. Time to first live workflow varies from 3 weeks to 4 months.',
   s:'Offer three onboarding packages (Starter, Guided, Regulated) with fixed scope, templates and a named success contact.',
   b:'New mid-market customers and the customer success team that scopes each onboarding.', m:'Median time to first live workflow under 6 weeks; onboarding satisfaction above 4.3 out of 5.',
   st:'accepted', sub:-26, pk:-25, dec:{ o:'accepted', by:'kofi', d:-12, sc:[4,3,5], r:'Fits the retention theme and customer success is ready to pilot. The owner agreed with the panel before the decision.', own:'theo', h:35 } },
 { k:'marketplace', c:'business', a:'omar', co:[], eff:'XL', tags:['integrations','partners'], t:'Open-source connector marketplace',
   p:'Partners and customers build connectors for Kompass but have nowhere to share them, so the same CRM and ticketing connectors are built repeatedly.',
   s:'Launch a marketplace where approved open-source connectors can be listed, reviewed for security and installed into a workspace.',
   b:'Customers and partners who build integrations, and our solutions team who maintain duplicates.', m:'20 community connectors listed within a year; 30 percent of new workspaces installing at least one.',
   st:'parked', sub:-48, pk:-46, dec:{ o:'parked', by:'ravi', d:-35, sc:[4,5,3], r:'Promising, but it needs security review capacity and legal terms for third-party code that do not exist yet. Parking until the platform security roadmap lands in the new year.', rev:30 } },
 { k:'fixedfee', c:'business', a:'jess', co:[], eff:'M', tags:['pricing','customer-feedback'], t:'Fixed-fee migration service',
   p:'Prospects hesitate because migration estimates from other tools vary widely and we quote time and materials.',
   s:'Offer a fixed-fee migration service with three published tiers based on workflow count.',
   b:'Prospects migrating from other automation tools and our services team.', m:'Win rate on migration deals up 10 points.',
   st:'declined', sub:-58, pk:-56, dec:{ o:'declined', by:'ravi', d:-44, sc:[3,4,2], r:'Fixed fees would put the services margin at risk because we cannot yet predict migration effort. Two pilots in the last year both ran over by more than 40 percent.', cm:'Data from at least five completed migrations showing effort within 20 percent of a published tier, plus a pricing model agreed with finance.' } },

 { k:'releasechk', c:'process', a:'sofia', co:[], eff:'M', tags:['ci-cd','docs','compliance'], t:'One release checklist for every service',
   p:'We have four different release checklists across services and none of them cover rollback or customer communication. Last quarter a hotfix skipped two required steps because nobody knew which list was current.',
   s:'Create a single release checklist with a core section for every service and optional sections by risk level, owned by the release managers and versioned in the repository.',
   b:'All engineering teams, release managers, support (who need advance notice of customer-visible changes) and auditors.', m:'All services using the shared checklist within a quarter; zero releases missing a required step in audits.',
   st:'under_review', sub:-24, pk:-22 },
 { k:'triage', c:'process', a:'chloe', co:[], eff:'S', tags:['support','meetings'], t:'Weekly support-to-engineering triage rota',
   p:'Support pings engineers ad hoc in chat and about six hours a week disappear into untracked interruptions. Customers wait while the right engineer is found.',
   s:'Run a weekly support-to-engineering triage rota with a fixed slot, a shared board and clear rules for what goes through the rota and what goes to on-call.',
   b:'The support team (about 14), the engineers pulled into ad hoc requests, and waiting customers.', m:'Untracked interruptions down by 70 percent; median time to engineering response under one day.',
   st:'under_review', sub:-21, pk:-19 },
 { k:'severity', c:'process', a:'theo', co:[], eff:'S', tags:['support','compliance'], t:'Standard severity levels for customer escalations',
   p:'Support and engineering disagree on what counts as a severity-two escalation, which leads to arguments and inconsistent customer updates.',
   s:'Agree one severity definition with examples, response times and update cadence, published in the support handbook and linked from the ticket form.',
   b:'Support, engineering on-call and customers who receive inconsistent updates.', m:'Severity disputes down from about 10 to 2 a month; update cadence met in 90 percent of escalations.',
   st:'under_review', sub:-19, pk:-17 },
 { k:'adr', c:'process', a:'pia', co:[], eff:'S', tags:['docs','onboarding'], t:'Decision-log template for architecture reviews',
   p:'Architecture decisions are recorded in scattered pages and nobody can find why a past choice was made, so the same debates repeat every year.',
   s:'Adopt a one-page decision template and a searchable index, started with the ten most important past decisions.',
   b:'Engineers, new joiners and architects who revisit past choices.', m:'Time to find a past decision under 5 minutes; 90 percent of new design reviews linking an entry.',
   st:'under_review', sub:-17, pk:-15 },
 { k:'meetings', c:'process', a:'lena', co:[], eff:'S', tags:['meetings'], t:'Retire recurring meetings after 90 days unless renewed',
   p:'Recurring meetings pile up. A survey found a typical team has 11 hours of recurring meetings per person per week and many have no clear owner.',
   s:'Give every recurring meeting a 90-day expiry. Organisers renew it with a one-line purpose, otherwise it drops off calendars automatically.',
   b:'All teams, and managers who want more focus time.', m:'Recurring meeting hours per person down by 20 percent within two quarters.',
   st:'under_review', sub:-16, pk:-13 },
 { k:'anon', c:'process', a:'priya', anon:true, co:[], eff:'M', tags:['compliance'], t:'Anonymous channel for flagging process shortcuts under deadline pressure',
   p:'In a recent pulse survey about 25 percent of people said they had skipped a step under deadline pressure, such as a security check or code review. They stay quiet because raising it feels like blaming a colleague or a manager.',
   s:'Provide an anonymous channel for reporting process shortcuts, triaged weekly by a small group outside the reporting line, with themes shared back to teams.',
   b:'Engineers and support staff under delivery pressure, and leaders who want an honest picture of process health.', m:'At least 20 reports in the first quarter; three process changes traced to themes.',
   st:'under_review', sub:-6, pk:-5 },
 { k:'expense', c:'process', a:'quinn', co:[], eff:'M', tags:['automation','reporting'], t:'Automatic categorisation of travel expense claims',
   p:'Finance categorises about 300 travel expense claims a month by hand, which takes two people two days at month end and still leaves coding errors.',
   s:'Suggest a category and cost centre for each claim from the receipt, merchant and trip purpose, with a person approving any low-confidence match.',
   b:'The finance team and employees who wait for reimbursements.', m:'Manual categorisation time down by 80 percent; coding errors under 2 percent.',
   st:'under_review', sub:-1 },
 { k:'access', c:'process', a:'ivan', co:[], eff:'M', tags:['security','automation'], t:'Self-serve access requests with automatic expiry',
   p:'Access requests go through email and take an average of 4 days. Temporary access is rarely removed afterwards.',
   s:'A self-serve request form with manager approval, automatic expiry for temporary access and a monthly report of active grants.',
   b:'All employees who request access, IT, and the security team that audits it.', m:'Median grant time under 4 hours; no expired temporary access still active.',
   st:'implemented', sub:-140, pk:-138, dec:{ o:'accepted', by:'hannah', d:-128, sc:[4,3,4], r:'Fixes a real security gap and is small enough to deliver in one cycle. IT agreed to own the form.', own:'omar', h:30 }, proto:-120, impl:-75,
   del:{ hg:30, hl:28, tasks:[['Request form and approval flow',1],['Automatic expiry job',1],['Monthly grants report',1]], up:[[-100,'ivan','Form live for two pilot teams.'],[-75,'ivan','Rolled out company-wide. Expiry job removed 41 stale grants in its first run.']], imp:{ h:22, usd:1800, conf:'High', note:'Ticket system data for 90 days before and after launch.' }, contrib:['ivan','lena'] } },
 { k:'buddy', c:'process', a:'lena', co:[], eff:'S', tags:['onboarding'], t:'Week-one milestones in the onboarding buddy checklist',
   p:'New joiners get an onboarding buddy but no shared plan, so week one varies from very helpful to nothing at all.',
   s:'Add week-one milestones to the buddy checklist: accounts working on day one, a first small change shipped by Friday and three introductions.',
   b:'New joiners, buddies and managers.', m:'90 percent of new joiners hit all week-one milestones; new-joiner satisfaction at day 30 above 4.4.',
   st:'accepted', sub:-15, pk:-14, dec:{ o:'accepted', by:'elena', d:-6, sc:[3,1,4], r:'Very low effort with a clear benefit. People and Operations can run it without engineering support.', own:'theo', h:10 } },
 { k:'relnotes', c:'process', a:'marcus', co:['pia'], eff:'M', tags:['docs','ci-cd','automation'], t:'Draft release notes from merged pull requests',
   p:'Release notes are written by hand after each release and are often late or incomplete. Customers and support learn about changes from each other.',
   s:'Draft release notes automatically from merged pull requests and their labels, then let a writer edit and publish. Customer-visible changes get flagged for support.',
   b:'Customers, support and the technical writers who currently assemble notes manually.', m:'Release notes published within one day of release for 95 percent of releases; support tickets about undocumented changes down by half.',
   st:'accepted', sub:-30, pk:-28, dec:{ o:'accepted', by:'hannah', d:-16, sc:[4,2,4], r:'Combines two similar submissions and has a clear owner. The docs-first idea becomes the editing step.', own:'tomas', h:40 } },
 { k:'docsfirst', c:'process', a:'pia', co:[], eff:'S', tags:['docs'], t:'Docs-first release notes',
   p:'Release notes come last in the release process, so they are rushed or skipped, and support does not find out about changes in time.',
   s:'Write the customer-facing description first, as part of the pull request, and use it as the release note.',
   b:'Technical writers, support and customers.', m:'Every customer-visible pull request having a description at merge.',
   st:'merged', sub:-29, pk:-27, dec:{ o:'merged', by:'hannah', d:-16, sc:[3,2,4], r:'Same goal as the release-notes automation idea. Merging the two keeps one owner and credits both authors; the docs-first step is kept as the editing stage.', tgt:'relnotes' } },
 { k:'secreview', c:'process', a:'dev', co:[], eff:'M', tags:['security','compliance'], t:'Shorter security review for low-risk changes',
   p:'Security review for every change takes up to two weeks, even for copy changes and small configuration updates.',
   s:'Create a fast lane for changes classified as low-risk by a checklist, reviewed by the author’s team lead instead of the security team.',
   b:'Engineering teams waiting on security review, and the security team’s queue.', m:'Median time to approval for low-risk changes under 2 days.',
   st:'declined', sub:-52, pk:-50, dec:{ o:'declined', by:'hannah', d:-38, sc:[3,3,2], r:'The security team does not agree the checklist can separate low-risk changes reliably, and the proposal moves a control to team leads without extra training. We would be trading speed for risk.', cm:'A risk classification agreed with the security team, a pilot on one low-risk change type, and evidence that incidents did not rise.' } },

 { k:'supportdraft', c:'innovation', a:'theo', co:['chloe'], eff:'L', tags:['agents','support','knowledge-base'], t:'Agent that drafts first replies from the knowledge base',
   p:'Support agents write the first reply to the same twenty question types dozens of times a day, and first-response time has slipped to 5 hours.',
   s:'An agent that drafts a first reply from the knowledge base and the customer’s plan, which a support agent edits and sends. The draft always cites the articles it used.',
   b:'Support agents (about 14), and customers waiting for a first reply.', m:'Median first-response time under 90 minutes; at least 70 percent of drafts sent with light edits.',
   st:'prototype', sub:-42, pk:-41, dec:{ o:'accepted', by:'nina', d:-33, sc:[5,4,5], r:'Highest strategic fit in the queue and the support team has volunteered to test it. We will review draft quality weekly during the prototype.', own:'theo', h:80 }, proto:-26,
   del:{ hg:80, hl:46, tasks:[['Collect 500 resolved tickets as a test set',1],['Draft replies from the knowledge base',1],['Citation display in the agent UI',1],['Pilot with 4 agents',0],['Measure edit rate',0]], up:[[-12,'theo','Pilot started with 4 agents on billing and login questions.'],[-4,'chloe','Edit rate is 38 percent. Most edits fix tone, not facts.']] } },
 { k:'voc', c:'innovation', a:'ben', co:[], eff:'M', tags:['customer-feedback','analytics','agents'], t:'Voice-of-customer clustering for roadmap input',
   p:'Customer requests arrive through calls, tickets and surveys, and product managers read a sample at best. The same five requests keep surfacing without clear evidence of how often.',
   s:'Cluster customer feedback from calls, tickets and surveys into themes, show counts and example quotes, and update weekly for the roadmap review.',
   b:'Product managers, customer success and leadership who prioritise the roadmap.', m:'Quarterly roadmap review citing theme counts for every major item; feedback coverage above 80 percent.',
   st:'under_review', sub:-11, pk:-10 },
 { k:'gallery', c:'innovation', a:'priya', co:[], eff:'M', tags:['agents','onboarding','templates'], t:'Kompass workflow templates gallery for customers',
   p:'New Kompass customers start from a blank canvas and spend weeks recreating common workflows such as ticket triage and lead routing.',
   s:'Publish a gallery of ready-to-use workflow templates with a one-click import and a short guide, starting with ten popular use cases.',
   b:'New customers, solutions engineers and the customer success team.', m:'Time to first live workflow down by 30 percent; 50 percent of new workspaces importing a template.',
   st:'accepted', sub:-20, pk:-19, dec:{ o:'accepted', by:'nina', d:-3, sc:[5,3,5], r:'Excellent fit with the agent adoption theme, and the first ten templates already exist inside the services team. Omar has agreed to own delivery.', own:'omar', h:70 } },
 { k:'meetwf', c:'innovation', a:'emma', co:[], eff:'M', tags:['agents','meetings','automation'], t:'Turn meeting notes into tracked tasks automatically',
   p:'Action items from customer calls live in notes and never reach a tracker, so follow-ups are late. Customer success estimates 25 percent of promised follow-ups slip.',
   s:'Turn meeting notes into tracked tasks, assign owners from the attendee list and remind them before the due date.',
   b:'Customer success, sales and any team running customer calls.', m:'Follow-ups completed by the promised date up from 75 to 95 percent.',
   st:'under_review', sub:-1 },
 { k:'askroad', c:'innovation', a:'kofi', co:[], eff:'M', tags:['agents','knowledge-base','sales-enablement'], t:'Ask-the-roadmap assistant for sales and support',
   p:'Sales and support ask product managers the same roadmap questions every week, and answers vary depending on who replies.',
   s:'An internal assistant that answers roadmap questions from the published roadmap and decision notes and links to the source. It declines to answer anything marked confidential.',
   b:'Sales, support and customer success; product managers who answer repeat questions.', m:'Roadmap questions to product managers down by 60 percent.',
   st:'implemented', sub:-95, pk:-93, dec:{ o:'accepted', by:'nina', d:-85, sc:[4,3,5], r:'Good example of an agent with a narrow, safe scope. Kofi will keep the confidential-tag filter strict.', own:'omar', h:45 }, proto:-80, impl:-40,
   del:{ hg:45, hl:41, tasks:[['Index roadmap and decision notes',1],['Answer with source links',1],['Confidential tag filter',1],['Rollout to sales and support',1]], up:[[-65,'kofi','Assistant answering from 80 roadmap pages with links.'],[-40,'kofi','Launched to sales and support. 300 questions answered in the first fortnight.']], imp:{ h:40, usd:0, conf:'Medium', note:'Product manager survey and message counts in the roadmap channel before and after launch.' }, contrib:['kofi','wen','aiko'] } },
 { k:'handover', c:'innovation', a:'chloe', co:[], eff:'M', tags:['agents','support'], t:'Smart handover summaries for support shift changes',
   p:'At shift change, support leads write handover notes by hand and important context gets lost. Two escalations last quarter were dropped overnight.',
   s:'Generate a shift-handover summary from open tickets, escalations and recent customer messages, which the outgoing lead reviews before sending.',
   b:'Support leads, the next shift and customers with open escalations.', m:'Dropped escalations at shift change down to zero; handover time under 10 minutes.',
   st:'prototype', sub:-34, pk:-33, dec:{ o:'accepted', by:'nina', d:-24, sc:[4,3,4], r:'Clear problem with real consequences. Keep the lead as the reviewer so the summary is an aid, not a record.', own:'theo', h:40 }, proto:-18,
   del:{ hg:40, hl:12, tasks:[['Define handover template',1],['Draft summary from open tickets',1],['Add escalation highlights',0],['Pilot over two weeks',0]], up:[[-6,'chloe','First summaries tested on the EMEA shift. Leads asked for a clearer escalation section.']] } },
 { k:'health', c:'innovation', a:'grace', co:[], eff:'M', tags:['agents','analytics','customer-feedback'], t:'Customer health digest agent',
   p:'Customer success reviews account health in a monthly spreadsheet, so problems are noticed weeks after they start.',
   s:'A weekly digest agent that summarises usage, support and sentiment changes per account and suggests next steps for the account owner.',
   b:'Customer success managers and account owners.', m:'Account issues noticed within a week; digest opened by 80 percent of account owners.',
   st:'parked', sub:-40, pk:-38, dec:{ o:'parked', by:'kofi', d:-28, sc:[4,3,4], r:'Overlaps heavily with the renewal-risk score that was just accepted. We should see what that delivers first rather than build two similar signals.', rev:20 } },

 { k:'d_sandbox', c:'innovation', a:'priya', co:[], eff:'', tags:[], t:'Customer-facing sandbox for Kompass agents', p:'Prospects cannot try a Kompass agent without talking to sales.', s:'', b:'', m:'', st:'draft', cr:-3 },
 { k:'d_handoff', c:'process', a:'priya', co:[], eff:'S', tags:['design-system'], t:'Shorter design-review handoff checklist', p:'Design reviews end with a long handoff checklist that engineers rarely read in full.', s:'Cut the checklist to the five items that caused rework last quarter.', b:'', m:'', st:'draft', cr:-1 },
 { k:'d_vuln', c:'tech', a:'marcus', co:[], eff:'', tags:['security'], t:'Dependency vulnerability gate before merge', p:'', s:'', b:'', m:'', st:'draft', cr:-2 },
 { k:'partnerportal', c:'business', a:'jess', co:[], eff:'S', tags:['partners'], t:'Partner referral portal',
   p:'Partners refer customers by email and we lose track of attribution.', s:'A simple portal where partners register referrals and see their status.', b:'Partner managers and partners.', m:'Referral attribution above 90 percent.',
   st:'withdrawn', sub:-30, wd:{ d:-26, r:'Superseded by the partner co-marketing playbook proposal. I will fold the referral ideas into that.' } },
 /* Problem radar and reopen seed: appended after the original ideas so the seeded random engagement of earlier ideas is unchanged */
 { k:'jobalerts', c:'tech', a:'quinn', co:[], eff:'S', tags:['automation','observability'], t:'Failure alerts for the nightly billing export job',
   p:'The nightly billing export is a scheduled job that fails silently. Finance only noticed two silent job failures when invoices were late, because nobody is alerted when a scheduled job stops running.',
   s:'Send a message to the finance channel whenever the billing export job fails or does not finish by 06:00, with a link to the last log lines.',
   b:'Finance analysts (about 6) who close the month, and customers waiting for invoices.', m:'Failed billing exports noticed within 15 minutes instead of a day; zero late invoices caused by a silent failure.',
   st:'declined', sub:-40, pk:-39, dec:{ o:'declined', by:'ivan', d:-30, sc:[3,2,3], r:'An alert for one export treats the symptom. The same silent failure exists for dozens of scheduled jobs, and a one-off alert would be another thing nobody maintains. We would rather see a platform-level proposal with named owners.', cm:'A platform-wide proposal covering every scheduled job with named owners, or evidence that this single export fails more than twice a quarter.' } },
 { k:'jobowner', c:'tech', a:'chloe', co:[], eff:'M', tags:['automation','observability','docs'], t:'Owner registry for scheduled jobs',
   p:'Scheduled jobs on the shared servers have no named owner, so when a job fails silently nobody notices or knows who should fix it. Last quarter two silent job failures went unreported for days.',
   s:'A registry that lists every scheduled job with an owner and a contact channel, and flags jobs whose owner has left or changed teams.',
   b:'On-call engineers, support leads who field the first complaint, and finance who depend on the exports.', m:'100 percent of scheduled jobs with a named owner; time to find the owner of a failed job under 5 minutes.',
   st:'parked', sub:-18, pk:-17, dec:{ o:'parked', by:'nina', d:-9, sc:[3,3,3], r:'The registry is sound but it depends on a decision about where scheduled jobs will run long term. Building it before that choice would mean rebuilding it, so we are parking it for now and tracking how often the problem is raised.', rev:45 } },
 { k:'jobstale', c:'tech', a:'ben', co:[], eff:'S', tags:['automation','observability'], t:'Weekly report of scheduled jobs that did not run',
   p:'Scheduled data jobs fail silently and dashboards go stale before anyone notices. There is no central view of which jobs ran, and no owner to alert when a scheduled job fails.',
   s:'A weekly report listing every scheduled job that failed or skipped a run, sent to the team that depends on its output.',
   b:'Analysts and data engineers who rely on scheduled jobs for dashboards.', m:'Silent job failures found within a day; stale-dashboard complaints down by half.',
   st:'declined', sub:-7, pk:-6, dec:{ o:'declined', by:'elena', d:-3, sc:[2,2,3], r:'This is the third time in a quarter that silent scheduled-job failures have been raised. A report only repeats the gap; the panel wants one platform answer, so we are keeping the owner-registry idea parked rather than adding a second small fix.', cm:'The owner registry or a platform scheduler is accepted and a report is still needed on top of it.' } },
 { k:'agentcanary', c:'innovation', a:'farid', co:[], eff:'M', tags:['agents','testing','support'], t:'Canary checks for customer-facing agent templates',
   p:'When an agent template changes, customer-facing agent behaviour can break silently and we only find out from support tickets. Two customers reported agent regressions last month before anyone on our side noticed.',
   s:'Run a small set of canary conversations against each customer-facing template after every change and flag answers that drift from the approved ones.',

/* All state changes go through Store.dispatch(name, payload). Views never mutate state. */
const Store = {
  version:0, persistence:'ok', persistNote:'', listeners:new Set(), saveTimer:null, ui:{ popover:null, drawer:false, bannerDismissed:false },
  get state(){ return _state; },
  subscribe(fn){ this.listeners.add(fn); return () => this.listeners.delete(fn); },
  dispatch(name, payload){
    const fn = ACTIONS[name];
    if (!fn) { console.error('[IdeaHub] unknown action', name); return { ok:false, error:'Unknown action ' + name }; }
    let res;
    if (!_state.meta.currentUserId && !/^(session\.|persona\.|ui\.)/.test(name)) return { ok:false, error:'Sign in first.' };
    try { res = fn(_state, payload || {}, { now:Date.now(), actor:_state.meta.currentUserId, role:_state.meta.activeRole }); }
    catch (e) { console.error('[IdeaHub] action failed', name, e); return { ok:false, error:'Something went wrong: ' + e.message }; }
    if (res && res.ok === false) return res;
    this.version++; this.schedulePersist();
    this.listeners.forEach(l => { try { l(name); } catch (e) { console.error('[IdeaHub] listener failed', e); } });
    return res || { ok:true };
  },
  schedulePersist(){ this.persistNow(); },   /* synchronous: a reload right after any action never loses it */
  persistNow(){
    if (this.saveTimer) { clearTimeout(this.saveTimer); this.saveTimer = null; }
    if (this.persistence === 'memory') return;
    try { localStorage.setItem(IH.storageKey, JSON.stringify(_state)); }
    catch (e) {
      try { trimForQuota(_state); localStorage.setItem(IH.storageKey, JSON.stringify(_state)); }
      catch (e2) { this.persistence = 'memory'; this.persistNote = 'Browser storage is full or blocked.'; this.listeners.forEach(l => l('persistence')); }
    }
  }
};

    if (Object.keys(fe).length) return { ok:false, error:'Please fix the highlighted fields.', fieldErrors:fe };

    const to = map[dec], at = c.now;
    const rec = { id:H.id('dec'), ideaId:i.id, outcome:dec === 'info' ? 'needs_info' : to, reason, deciderId:c.actor, at, scores, ownerId:owner ? owner.id : null, awaitingOwner:dec === 'accept' && !owner, hours:dec === 'accept' ? hours : null, revisitAt:revisit || null, mergedIntoId:target ? target.id : null, changeMind:dec === 'decline' ? String(p.changeMind).trim() : '', question:dec === 'info' ? reason : '', asRole:ar(user) };
    s.ent.decisions[rec.id] = rec;

    if (scores) { const ex = Object.values(s.ent.reviews).find(r => r.ideaId === i.id && r.reviewerId === c.actor); const rv = ex || { id:H.id('rev'), ideaId:i.id, reviewerId:c.actor }; Object.assign(rv, scores, { comment:String(p.comment || ''), at }); s.ent.reviews[rv.id] = rv; }
    H.hist(i, to, c.actor, reason, at);
    const label = STATUS[to].label, audience = H.audience(i, c.actor);

    if (dec === 'accept') { i.ownerId = owner ? owner.id : null; i.awaitingOwner = !owner; i.hoursRecommended = hours; text += owner ? ' Owner: ' + owner.name + '.' : ' It is waiting for an owner.'; }

    }
    H.activity(i.id, c.actor, dec === 'info' ? 'asked' : 'decided', dec === 'info' ? '' : to, at); RECOG.onDecision(i, rec, at);

  'delivery.requestHours':(s, p, c) => {

    if (!i.ownerId) return { ok:false, error:'Assign an owner before requesting hours.' };

    H.notify(lead, { kind:'attention', ideaId:i.id, text:H.name(c.actor) + ' requested ' + hours + ' innovation hours for “' + i.title + '”. Your decision is needed.', href:'#/ideas/' + i.id + '?tab=delivery' }, c.now);
    return { ok:true, data:{ id, notified:lead.length } };
  },
  'delivery.decideHours':(s, p, c) => {
    const err = H.need(['leadership','admin']); if (err) return { ok:false, error:err };
    const r = s.ent.hourRequests[p.requestId]; if (!r || r.state !== 'pending') return { ok:false, error:'This request is no longer pending.' };
    const i = H.idea(r.ideaId), reason = String(p.reason || '').trim();
