    if (r.requestedBy === c.actor) return { ok:false, error:'You made this request, so another leader or administrator has to decide it.' };
    if (!p.approve) {
      if (reason.length < 10) return { ok:false, error:'A reason is required when declining.', fieldErrors:{ reason:'Explain why (at least 10 characters). The owner sees this.' } };
      r.state = 'declined'; r.decidedBy = c.actor; r.decidedAt = c.now; r.reason = reason; i.updatedAt = c.now;
      H.notify([r.requestedBy, i.ownerId], { kind:'decision', ideaId:i.id, text:H.name(c.actor) + ' declined the ' + r.hours + ' hour request for “' + i.title + '”: ' + trunc(reason, 160) + ' You can adjust and request again.', href:'#/ideas/' + i.id + '?tab=delivery', exclude:c.actor }, c.now);
      return { ok:true, data:{ state:'declined' } };
    }

    const rem = SEL.pool().remaining;
    if (hours > rem && !p.override) return { ok:false, error:'This is ' + (hours - rem) + ' hours more than the pool has left (' + Math.max(0, rem) + ' remaining).', needsOverride:true, remaining:rem };

    H.hist(i, 'prototype', c.actor, 'Innovation hours granted (' + hours + ' h' + (hours > rem ? ', pool exceeded with explicit override' : '') + '). Prototype started.', c.now);
    i.delivery = { hoursGranted:hours, startedAt:c.now, implementedAt:null, hoursLog:[], contributors:SEL.collabsAccepted(i.id).filter(r => r.type === 'build' && r.fromUserId !== i.ownerId && !SEL.isCreditedAuthor(i, r.fromUserId)).map(r => ({ userId:r.fromUserId, role:'Builder', addedAt:c.now, addedBy:c.actor })), impact:[], outcome:'', shares:[], announcementId:null };

// ==== SECTION 5 SELECTORS ====
/* Pure derived data. Nothing derived here is ever stored. */
const SEL = {
  me(){ return _state.ent.users[_state.meta.currentUserId]; },
  user(id){ return _state.ent.users[id]; },
  users(){ return Object.values(_state.ent.users); },
  team(id){ return _state.ent.teams[id]; },
  cat(id){ return _state.ent.categories[id]; },
  panel(id){ return _state.ent.panels[id]; },
  panelOf(idea){ return _state.ent.panels[_state.ent.categories[idea.categoryId].panelId]; },
  idea(id){ return _state.ent.ideas[id]; },
  allIdeas(){ return Object.values(_state.ent.ideas); },
  liveIdeas(){ return SEL.allIdeas().filter(i => !['draft','withdrawn'].includes(i.status)); },
  /* ideas a viewer may see in lists. Drafts only for their author. */
  visibleIdeas(viewerId, includeWithdrawn){ return SEL.allIdeas().filter(i => i.status === 'draft' ? false : (i.status === 'withdrawn' ? !!includeWithdrawn : true)); },
  drafts(userId){ return SEL.allIdeas().filter(i => i.status === 'draft' && i.authorId === userId).sort((a, b) => b.updatedAt - a.updatedAt); },
  stageOf(i){
    if (['draft','withdrawn'].includes(i.status)) return -1;
    if (i.status === 'submitted') return 0;
    if (i.status === 'under_review') return i.pickedUpAt ? 1 : 0;
    if (i.status === 'needs_info') return 1;
    if (DECISION_STATUSES.includes(i.status)) return 2;
    return i.status === 'prototype' ? 3 : 4;
  },
  subState(i){
    switch (i.status) {
      case 'submitted': return 'Routing to panel';
      case 'under_review': return i.pickedUpAt ? 'In review' : 'Awaiting pickup';
      case 'needs_info': return 'Waiting for author';
      case 'accepted': return i.ownerId ? 'Accepted, owner assigned' : 'Accepted, awaiting owner';
      case 'parked': return 'Parked until ' + fmtDate(i.revisitAt);
      case 'merged': return 'Merged';
      case 'declined': return 'Declined';
      case 'prototype': return 'Building prototype';
      case 'implemented': return 'Implemented';
      case 'withdrawn': return 'Withdrawn';
      default: return 'Draft';
    }
  },
  /* ---- masking: never reveal an anonymous author ---- */
  authorRef(i, viewerId){
    if (i.anonymous) return { anon:true, self:viewerId === i.authorId, label:viewerId === i.authorId ? 'Anonymous (you)' : 'Anonymous', user:null };
    const u = _state.ent.users[i.authorId]; return { anon:false, self:viewerId === i.authorId, label:u.name, user:u };
  },
  personRef(userId, idea){
    if (idea && idea.anonymous && (userId === idea.authorId || (idea.anonCoAuthorIds || []).includes(userId))) return { anon:true, label:'Anonymous author', user:null };

  },
  /* ---- engagement ---- */
  votes(id){ return Object.values(_state.ent.votes).filter(v => v.ideaId === id); },
  voteCount(id){ let n = 0; for (const k in _state.ent.votes) if (_state.ent.votes[k].ideaId === id) n++; return n; },
  hasVoted(id, u){ return !!_state.ent.votes[id + '|' + u]; },
  followers(id){ return Object.values(_state.ent.follows).filter(f => f.ideaId === id); },
  isFollowing(id, u){ return !!_state.ent.follows[id + '|' + u]; },
  comments(id){ return Object.values(_state.ent.comments).filter(c => c.ideaId === id).sort((a, b) => a.at - b.at); },
  commentCount(id){ let n = 0; for (const k in _state.ent.comments) if (_state.ent.comments[k].ideaId === id) n++; return n; },
  decisions(id){ return Object.values(_state.ent.decisions).filter(d => d.ideaId === id).sort((a, b) => a.at - b.at); },
  latestDecision(id){ const d = SEL.decisions(id).filter(x => x.outcome !== 'needs_info'); return d[d.length - 1] || null; },
  history(id){ return Object.values(_state.ent.history).filter(h => h.ideaId === id).sort((a, b) => a.at - b.at || a.id.localeCompare(b.id, undefined, { numeric:true })); },
  runsFor(id){ return Object.values(_state.ent.agentRuns).filter(r => r.ideaId === id).sort((a, b) => a.startedAt - b.startedAt); },
  allRuns(){ return Object.values(_state.ent.agentRuns).sort((a, b) => b.startedAt - a.startedAt); },
  savedReview(ideaId, reviewerId){ return Object.values(_state.ent.reviews).find(r => r.ideaId === ideaId && r.reviewerId === reviewerId) || null; },
  anyReview(ideaId){ return Object.values(_state.ent.reviews).filter(r => r.ideaId === ideaId); },
  mergedInto(i){ return i.mergedIntoId ? _state.ent.ideas[i.mergedIntoId] : null; },
  mergedChildren(id){ return SEL.allIdeas().filter(i => i.mergedIntoId === id && i.status === 'merged'); },
  lastUpdate(i){ const d = i.delivery; let t = d ? d.startedAt : i.updatedAt; if (d) { const k = SEL.lastCheckin(i); if (k && k > t) t = k; } return t; },
  /* ---- phase 4: delivery, innovation hours, impact ---- */
  hoursLogged(d){ return d ? (d.hoursLog || []).reduce((a, x) => a + x.hours, 0) : 0; },
  pool(){

    Object.values(_state.ent.hourRequests).forEach(r => { if (r.state === 'pending') pending += r.hours; });

  pendingRequests(){ return Object.values(_state.ent.hourRequests).filter(r => r.state === 'pending').sort((a, b) => a.at - b.at); },
  isTeamLeadOrAdmin(u){ return !!u && ['lead','admin'].includes(ar(u)); },

  canManageDelivery(i, u){ return !!(u && i.delivery && i.status === 'prototype' && (i.ownerId === u.id || SEL.isTeamLeadOrAdmin(u))); },
  canRequestHours(i, u){ return !!(u && i.status === 'accepted' && i.ownerId && !SEL.pendingRequest(i.id) && (i.ownerId === u.id || SEL.isTeamLeadOrAdmin(u))); },
  canDecideHours(u){ return !!u && ['leadership','admin'].includes(ar(u)); },
  canVerify(i, entry, u){
    if (!u || !['leadership','admin'].includes(ar(u))) return { ok:false, why:'Only leadership or an administrator can verify impact. Work in the Leadership or Administrator role.' };

const num1 = n => (Math.round(n * 10) / 10).toLocaleString('en-US');
function dataTable(caption, heads, rows){

}
function chartCard(id, title, sub, chart, table, tableTitle, extra){
  return html`<section class="card ${extra || ''}" id="ins-${id}" aria-labelledby="ins-h-${id}"><div class="card__head"><h2 id="ins-h-${id}">${title}</h2></div>${sub ? html`<p class="muted small" style="margin:-4px 0 10px">${sub}</p>` : ''}${chart}<details class="ins-data" id="ins-d-${id}"><summary>${tableTitle || 'Data table (text version of this chart)'}</summary>${table}</details></section>`;
}
function lineChart(buckets, ariaLabel){
  const W = 560, H = 190, pl = 30, pr = 10, pt = 14, pb = 26, n = buckets.length, max = Math.max(1, ...buckets.map(b => b.n));
  const x = k => pl + (n === 1 ? 0 : (W - pl - pr) * k / (n - 1)), y = v => pt + (H - pt - pb) * (1 - v / max);
  const grid = [0, 0.5, 1].map(f => { const v = Math.round(max * f); return '<line class="grid-l" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (pl - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + v + '</text>'; }).join('');
  const line = buckets.map((b, k) => (k ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(b.n).toFixed(1)).join(' ');
  const area = line + ' L' + x(n - 1).toFixed(1) + ' ' + y(0).toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';
  const every = Math.max(1, Math.ceil(n / 5));
  const labs = buckets.map((b, k) => (k % every === 0 || k === n - 1) ? '<text x="' + x(k).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(b.label) + '</text>' : '').join('');
  const dots = buckets.map((b, k) => '<circle class="pt" cx="' + x(k).toFixed(1) + '" cy="' + y(b.n).toFixed(1) + '" r="3.5"/>').join('');
  return raw('<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ariaLabel) + '" preserveAspectRatio="xMidYMid meet">' + grid + '<line class="axis" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(0) + '" y2="' + y(0) + '"/><path class="area" d="' + area + '"/><path class="ln" d="' + line + '"/>' + dots + labs + '</svg>');
}
function legend(groups){ return html`<ul class="legend" aria-hidden="true">${groups.map(g => html`<li><i style="background:${raw(esc(g.color))}"></i>${g.label}</li>`)}</ul>`; }
function sbarRow(label, counts, groups, scaleMax, total, href){

function rcPreview(v){
  const lv = v.levels.slice().sort((a, b) => a.min - b.min), split = (tot, n) => { const base = Math.floor(tot / n), rem = tot - base * n; return Array.from({ length:n }, (_, k) => base + (k < rem ? 1 : 0)); };

  const comb = Math.round((v.pw * 80 + v.aw * 50) / 100 * 10) / 10;
  return [ 'An accepted idea with two authors: ' + acc.join(' and ') + ' points (' + v.accepted + ' shared equally).',
    'An implemented idea credited 60 / 40: ' + Math.round(v.implemented * 0.6) + ' and ' + Math.round(v.implemented * 0.4) + ' points.',
