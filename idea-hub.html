<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Hub (Project Polaris) - Dotkonnekt</title>
<meta name="description" content="Idea Hub MVP: an AI-native innovation management prototype. All agent activity is simulated.">
<!-- Optional web fonts. If this link fails (offline, blocked) the system fallback stack in the tokens block is used.
     The Google Fonts URL is UNVERIFIED against the official Dotkonnekt font loading method. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<!--
=====================================================================================================
IDEA HUB MVP  -  single-file application (phases 1-3 of the build plan)
Section index (search for the banner text; never edit by line number):
  CSS  : SECTION C1 TOKENS | C2 BASE AND LAYOUT | C3 COMPONENTS | C4 MODULE STYLES | C5 RESPONSIVE
  JS   : 0 NAMESPACE | 1 UTILS | 2 SCHEMA AND CONSTANTS | 3 SEED DATA | 4 STORE AND ACTIONS | 5 SELECTORS
         6 TEXT ANALYSIS (agent heuristics) | 7 SERVICES (api, AgentGateway) | 8 MOCK AGENT ENGINE
         9 UI KIT | 10 ROUTER AND SHELL | 11 VIEWS (one banner per module) | 12 EVENTS | 13 BOOT
Extension points for later phases are marked "EXTENSION POINT".
All AI in this file is SIMULATED (deterministic JavaScript over demo data). No language model is called.
=====================================================================================================
-->
<style>
/* ==== SECTION C1 TOKENS ==== */
/* PROVISIONAL TOKENS - approximation pending Dotkonnekt tokens.css
   The official Dotkonnekt token values were not available. Every colour, radius, spacing, shadow and font
   value used by the app is defined in this block (and the dark override below). Replace this block only. */
:root{
  --font-sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;

  --bg:#F6F6FA; --surface:#FFFFFF; --surface-2:#F0F0F6; --surface-3:#E8E8F0;
  --border:#E2E2EB; --border-strong:#C9C9D8;
  --text:#16151D; --text-2:#46455A; --text-3:#686779;
  --overlay:rgba(18,16,30,.45);

  --brand:#6D4AFF; --brand-hover:#5A37EC; --brand-ink:#4B2DD6; --brand-soft:#EFEBFF; --brand-line:#CFC3FF; --on-brand:#FFFFFF;
  --gold:#E0A526; --gold-ink:#7E5600; --gold-soft:#FFF4D6;
  --success:#0F7B55; --success-soft:#DDF4EA;
  --warning:#9A5B00; --warning-soft:#FFEFD0;
  --danger:#C1303A;  --danger-soft:#FDE3E5;
  --info:#2459C7;    --info-soft:#E1EBFD;
  --neutral-soft:#ECECF3;
  --cat-tech:#2F6FD0; --cat-business:#14867A; --cat-process:#6A788F; --cat-innovation:#B3417F;
  --av-1:#6D4AFF; --av-2:#2F6FD0; --av-3:#14867A; --av-4:#B3417F; --av-5:#C26A1A; --av-6:#5B6B8C; --av-7:#8A4FD0; --av-8:#2E8A4F;

  --agent-bg:linear-gradient(135deg,rgba(109,74,255,.07),rgba(109,74,255,.02));
  --agent-border:#D9D0FF; --agent-glow:0 0 0 3px rgba(109,74,255,.12);

  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --shadow-1:0 1px 2px rgba(22,21,29,.05),0 1px 1px rgba(22,21,29,.03);
  --shadow-2:0 12px 32px rgba(22,21,29,.16),0 2px 6px rgba(22,21,29,.08);
  --focus:0 0 0 3px rgba(109,74,255,.38);

  --sidebar-w:244px; --sidebar-w-collapsed:64px; --topbar-h:58px;
  --fs-eyebrow:11px; --fs-small:12.5px; --fs-body:14px; --fs-h3:16px; --fs-h2:20px; --fs-h1:28px; --fs-kpi:30px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0D0C13; --surface:#15141D; --surface-2:#1C1B27; --surface-3:#262533;
  --border:#2A2938; --border-strong:#3B3A4E;
  --text:#ECEBF4; --text-2:#B9B7CB; --text-3:#9593AA;
  --overlay:rgba(0,0,0,.6);
  --brand:#7352F5; --brand-hover:#8566FF; --brand-ink:#BCAEFF; --brand-soft:#241F45; --brand-line:#4A3F8F; --on-brand:#FFFFFF;
  --gold:#E8B544; --gold-ink:#F0C969; --gold-soft:#2E2512;
  --success:#4FD1A0; --success-soft:#12302A;
  --warning:#F0B35A; --warning-soft:#33260F;
  --danger:#FF7A83;  --danger-soft:#38171B;
  --info:#7FA8FF;    --info-soft:#14223F;
  --neutral-soft:#242330;
  --cat-tech:#6FA3F0; --cat-business:#4CC4B3; --cat-process:#9AA7BE; --cat-innovation:#E57DB2;
  --av-1:#7352F5; --av-2:#3A78D8; --av-3:#1C9486; --av-4:#BE4A8A; --av-5:#C9741F; --av-6:#66789C; --av-7:#9658DB; --av-8:#33944F;
  --agent-bg:linear-gradient(135deg,rgba(115,82,245,.16),rgba(115,82,245,.04));
  --agent-border:#463B8A; --agent-glow:0 0 0 3px rgba(115,82,245,.2);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 14px 36px rgba(0,0,0,.55);
  --focus:0 0 0 3px rgba(150,125,255,.5);
  color-scheme:dark;
}
/* ==== END SECTION C1 ==== */

/* ==== SECTION C2 BASE AND LAYOUT ==== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-h) + 16px)}   /* anchored and focused elements never hide under the sticky topbar */
body{margin:0;font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-wrap:anywhere}
/* long unbroken text (titles, tags, labels, pasted URLs) wraps instead of widening the page; flex and grid children may shrink */
.row>*,.listrow>*,.card__head>*,.meta-row>*,.chip-row>*,.feed li>*,.attn>*,.idea-card__foot>*,.timeline__item>*,.comment>*,.notif>*,.search__item>*,.person>*{min-width:0}
.main,.view,.stack,.stack>*,.layout-rail>*,.cards>*,.grid>*,.board__col,.board__list,.agent,.agent__body,.decision,.quote,.notice>*,.nextstep,.trace,.trace summary>*,.similar,.sugg>*,.dl>*{min-width:0}
.agent p,.agent li,.agent .quote,.trace__step>*,.notice,.nextstep,.decision,.similar{overflow-wrap:anywhere}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600;letter-spacing:-.01em}
h1{font-size:var(--fs-h1)} h2{font-size:var(--fs-h2)} h3{font-size:var(--fs-h3)} h4{font-size:var(--fs-body)}
p{margin:0}
a{color:var(--brand-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
ul,ol{margin:0;padding:0;list-style:none}
img,svg{max-width:100%}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);outline:2px solid transparent;border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--on-brand);padding:8px 12px;border-radius:var(--radius-sm);z-index:100}
.skip:focus{left:8px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)} .small{font-size:var(--fs-small)} .strong{font-weight:600}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.app.is-collapsed{grid-template-columns:var(--sidebar-w-collapsed) minmax(0,1fr)}
.main{min-width:0;display:flex;flex-direction:column}
.view{padding:var(--space-5) var(--space-6) var(--space-8);max-width:1480px;width:100%;margin:0 auto;min-width:0;outline:none}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:var(--space-4) var(--space-3);gap:var(--space-4);z-index:40;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.brand__mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand__text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand__word{font-weight:600;letter-spacing:-.02em}
.brand__sub{font-size:11px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav__label{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--radius-md);color:var(--text-2);font-weight:500;text-decoration:none;position:relative;min-height:40px}
.nav-item:hover{background:var(--surface-2);text-decoration:none;color:var(--text)}
.nav-item[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
.nav-item__badge{margin-left:auto;font-family:var(--font-mono);font-size:11px;background:var(--danger);color:#fff;border-radius:var(--radius-pill);padding:1px 7px}
.nav-item svg{flex:none}
.sidebar__foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--border)}
.sidebar__note{font-size:11px;color:var(--text-3);padding:0 8px}
.scrim{display:none}

.topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-6);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
@supports not (background:color-mix(in srgb,red,blue)){.topbar{background:var(--bg)}}
.topbar__title{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--text-3)}
.crumbs a{color:var(--text-3);white-space:nowrap;flex:none}
.crumbs svg{flex:none} .crumbs a:hover{color:var(--text)}
.crumbs [aria-current]{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{position:relative;flex:0 1 360px;min-width:0}
.search__input{width:100%;height:36px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-pill);padding:0 36px 0 36px;color:var(--text);font:inherit}
.search__icon{position:absolute;left:11px;top:9px;color:var(--text-3);pointer-events:none}
.search__kbd{position:absolute;right:10px;top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:18px}
.search__results{overflow-x:hidden;position:absolute;left:0;right:0;top:42px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:6px;max-height:70vh;overflow:auto;z-index:50;min-width:280px}
.search__group{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);padding:8px 8px 4px}
.search__item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:var(--radius-sm);color:var(--text);text-decoration:none;min-width:0}
.search__item .grow{min-width:0}
.search__field{position:relative;flex:1 1 auto;min-width:0}
.search .search__close{display:none}
#search-btn{display:none}
.search__item:hover,.search__item:focus{background:var(--surface-2);text-decoration:none}
.topbar__actions{display:flex;align-items:center;gap:8px;flex:none}
.role-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-pill);background:var(--gold-soft);color:var(--gold-ink);font-size:12px;font-weight:600;white-space:nowrap;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.popover{position:fixed;top:calc(var(--topbar-h) - 2px);right:var(--space-5);width:min(380px,calc(100vw - 24px));max-height:calc(100vh - var(--topbar-h) - 20px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);z-index:60}
.popover__head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.banner{display:flex;gap:12px;align-items:center;padding:10px var(--space-5);background:var(--warning-soft);color:var(--warning);border-bottom:1px solid var(--border);font-size:13px}
.banner .btn{margin-left:auto}
/* ==== END SECTION C2 ==== */

/* ==== SECTION C3 COMPONENTS ==== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:500;white-space:nowrap;text-decoration:none;line-height:1}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn--primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn--primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn--ghost{border-color:transparent;background:transparent}
.btn--danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn--danger:hover{background:var(--danger);filter:brightness(.92)}
.btn--sm{height:30px;padding:0 10px;font-size:13px}
.btn--icon{width:36px;padding:0}
.btn--block{width:100%}
.btn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.btn .count{font-family:var(--font-mono);font-size:12px}
.icon{flex:none;vertical-align:middle}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:var(--space-5);min-width:0}
.card--flush{padding:0}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-bottom:var(--space-4)}
.card__head h2,.card__head h3{overflow-wrap:break-word;min-width:0}
.card--tight{padding:var(--space-4)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--text-3);margin-bottom:var(--space-3)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--border)}
.eyebrow--plain::after{display:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-5);flex-wrap:wrap}
.page-head h1{margin-top:2px}
.page-head p{color:var(--text-2);margin-top:6px;max-width:68ch}
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.stack--sm{gap:var(--space-2)} .stack--lg{gap:var(--space-5)}
.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.row--between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.grid{display:grid;gap:var(--space-4)}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi-row--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.layout-rail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--space-5);align-items:start}
.layout-rail--wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.sticky{position:sticky;top:calc(var(--topbar-h) + 16px)}

.pill{display:inline-flex;align-items:center;gap:6px;min-height:22px;max-width:100%;padding:0 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--text-2)}
.pill--brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill--info{background:var(--info-soft);color:var(--info)}
.pill--success{background:var(--success-soft);color:var(--success)}
.pill--warning{background:var(--warning-soft);color:var(--warning)}
.pill--danger{background:var(--danger-soft);color:var(--danger)}
.pill--gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill--agent{background:var(--brand-soft);color:var(--brand-ink);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;min-height:20px;border:1px solid var(--agent-border)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;min-height:22px;max-width:100%;padding:1px 8px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-2);font-size:12px;border:1px solid var(--border);overflow-wrap:anywhere;word-break:break-word;line-height:1.35}
a.tag:hover{background:var(--surface-3);text-decoration:none}
.tag--removable{gap:6px;padding-right:4px}
.tag button{border:0;background:transparent;padding:0 4px;color:var(--text-3);height:18px;line-height:1;border-radius:4px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.suggest-chip{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--brand-line);background:var(--brand-soft);color:var(--brand-ink);border-radius:var(--radius-pill);padding:2px 4px 2px 10px;font-size:12.5px}
.suggest-chip button{border:0;background:transparent;color:inherit;height:22px;padding:0 6px;border-radius:var(--radius-pill);font-weight:600;font-size:12px}
.suggest-chip button:hover{background:var(--surface);}

.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none;letter-spacing:.02em}
.avatar--lg{width:64px;height:64px;font-size:22px}
.avatar--sm{width:22px;height:22px;font-size:9.5px}
.avatar--anon{background:var(--surface-3)!important;color:var(--text-3)}
.person{display:inline-flex;align-items:center;gap:8px;min-width:0;color:var(--text);font-weight:500}
.person:hover{text-decoration:none;color:var(--brand-ink)}
.avatar-stack{display:inline-flex}
.avatar-stack .avatar{margin-left:-6px;border:2px solid var(--surface)}
.avatar-stack .avatar:first-child{margin-left:0}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .label{font-weight:600;font-size:13px}
.field .hint{font-size:var(--fs-small);color:var(--text-3)}
.field .error{font-size:var(--fs-small);color:var(--danger);font-weight:500}
.field .error:empty{display:none}
.input,.select,.textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:var(--radius-md);padding:8px 12px;font:inherit;min-height:38px}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:var(--focus)}
.input[aria-invalid="true"],.textarea[aria-invalid="true"],.select[aria-invalid="true"]{border-color:var(--danger)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch__track{width:38px;height:22px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;transition:background .15s;margin-top:1px}
.switch__track::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .switch__track{background:var(--brand)}
.switch input:checked + .switch__track::after{transform:translateX(16px)}
.switch input:focus-visible + .switch__track{box-shadow:var(--focus)}
.segmented{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
.segmented label{position:relative;cursor:pointer}
.segmented input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.segmented span{display:grid;place-items:center;min-width:40px;height:34px;padding:0 12px;font-weight:600;border-left:1px solid var(--border)}
.segmented label:first-child span{border-left:0}
.segmented input:checked + span{background:var(--brand);color:var(--on-brand)}
.segmented input:focus-visible + span{box-shadow:inset var(--focus)}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.radio-card{position:relative;display:block;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:12px 14px;background:var(--surface);cursor:pointer}
.radio-card input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.radio-card:has(input:checked){border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.radio-card:has(input:focus-visible){box-shadow:var(--focus)}
.radio-card__title{font-weight:600;display:flex;gap:8px;align-items:center}
.radio-card__desc{font-size:var(--fs-small);color:var(--text-3);margin-top:4px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:var(--space-5);overflow-x:auto;scrollbar-width:none}
.tabs a,.tabs button{padding:10px 14px;color:var(--text-2);font-weight:500;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.tabs a:hover{color:var(--text);text-decoration:none}
.tabs [aria-selected="true"],.tabs [aria-current="page"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.tabs .count{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border-radius:99px;padding:1px 7px;color:var(--text-2)}

.kpi{display:flex;flex-direction:column;gap:4px;padding:var(--space-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);color:var(--text);text-decoration:none;min-width:0;position:relative}
a.kpi:hover{border-color:var(--brand-line);text-decoration:none;box-shadow:0 0 0 3px var(--brand-soft)}
.kpi__label{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:600}
.kpi__value{font-family:var(--font-mono);font-size:var(--fs-kpi);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.kpi__sub{font-size:var(--fs-small);color:var(--text-3)}
.kpi--accent .kpi__value{color:var(--brand-ink)}

.table-wrap{position:relative;overflow-x:auto;max-width:100%;min-width:0}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:var(--surface-2)}
.table .title-cell{min-width:240px;max-width:420px;font-weight:600}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.step{position:relative;padding:0 8px 0 0;min-width:0}
.step::before{content:"";position:absolute;top:13px;left:28px;right:0;height:2px;background:var(--border-strong)}
.step:last-child::before{display:none}
.step--done::before{background:var(--brand)}
.step__dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1;font-size:12px;font-weight:700;color:var(--text-3)}
.step--done .step__dot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.step--current .step__dot{border-color:var(--brand);color:var(--brand-ink);box-shadow:var(--agent-glow);background:var(--brand-soft)}
.step--bad .step__dot{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.step--paused .step__dot{border-color:var(--warning);color:var(--warning);background:var(--warning-soft)}
.step__label{margin-top:8px;font-weight:600;font-size:13px}
.step__meta{font-size:12px;color:var(--text-3);margin-top:2px}
.step--future .step__label{color:var(--text-3)}

.agent{background:var(--agent-bg),var(--surface);border:1px solid var(--agent-border);border-left:3px solid var(--brand);border-radius:var(--radius-lg);padding:var(--space-4);min-width:0}
.agent__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-3)}
.agent__name{font-weight:600;color:var(--brand-ink)}
.agent__kind{font-size:11px;color:var(--text-3);margin-left:auto;font-family:var(--font-mono)}
.agent__body{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.agent__foot{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px dashed var(--agent-border);font-size:11.5px;color:var(--text-3)}
.agent--thinking{box-shadow:var(--agent-glow)}
.agent h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:4px}
.agent ul.bullets{list-style:disc;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.quote{border-left:2px solid var(--border-strong);padding-left:10px;color:var(--text-2);font-size:13px}
.quote cite{display:block;font-style:normal;font-size:12px;color:var(--text-3)}
.skeleton{display:flex;flex-direction:column;gap:8px}
.skeleton i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.trace{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.trace summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.trace summary::-webkit-details-marker{display:none}
.trace summary::before{content:"\25B8";color:var(--text-3);transition:transform .15s}
.trace[open] summary::before{transform:rotate(90deg)}
.trace__steps{padding:0 12px 12px 28px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.trace__step{display:grid;grid-template-columns:86px 1fr auto;gap:10px;font-size:13px}
.trace__kind{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-ink)}

.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.timeline__item{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:var(--space-4);position:relative}
.timeline__item::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--border)}
.timeline__item:last-child::before{display:none}
.timeline__dot{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--text-2)}
.timeline__dot--agent{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--agent-border)}
.timeline__dot--bad{background:var(--danger-soft);color:var(--danger)}
.timeline__dot--good{background:var(--success-soft);color:var(--success)}
.timeline__when{font-size:12px;color:var(--text-3)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:var(--space-7) var(--space-5);color:var(--text-2)}
.empty .icon{color:var(--text-3)}
.empty h3{color:var(--text)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-md);background:var(--info-soft);color:var(--text);font-size:13px;align-items:flex-start}
.notice--warn{background:var(--warning-soft)}
.notice--danger{background:var(--danger-soft)}
.notice--ok{background:var(--success-soft)}
.notice--brand{background:var(--brand-soft)}
.notice .icon{margin-top:2px}
.divider{height:1px;background:var(--border);margin:var(--space-4) 0;border:0}
.meter{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--brand);border-radius:99px}

.modal-backdrop{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--border)}
.modal__head{padding:18px 20px 0}
.modal__body{padding:12px 20px 4px;display:flex;flex-direction:column;gap:var(--space-4)}
.modal__foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px 20px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-2);font-size:13.5px;display:flex;gap:10px;align-items:center;max-width:420px}
.toast--error{background:var(--danger);color:#fff}
.toast--ok .icon{color:#7BE3B5}
/* ==== END SECTION C3 ==== */

/* ==== SECTION C4 MODULE STYLES ==== */
/* -- shell widgets -- */
.notif{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}
.notif:hover{background:var(--surface-2);text-decoration:none}
.notif__dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:transparent}
.notif--unread .notif__dot{background:var(--brand)}
.notif__text{display:block;font-size:13.5px}
.persona-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border:0;background:none;border-bottom:1px solid var(--border)}
.persona-item:hover{background:var(--surface-2)}
.persona-item[aria-current="true"]{background:var(--brand-soft)}
/* -- idea cards, charts, lists -- */
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:var(--space-4)}
.idea-card{display:flex;flex-direction:column;gap:10px}
.idea-card__title{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.idea-card__title a{color:var(--text)}
.idea-card__foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px}
.stagebar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.stagebar span{background:var(--brand);display:block;min-width:6px}
.stagebar__legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin-top:12px}
.stagebar__legend li{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.stagebar__legend li i{width:10px;height:10px;border-radius:3px;background:var(--brand);flex:none}
.stagebar__lab{flex:1 1 auto;min-width:0;color:var(--text-2)}
.funnel{display:flex;flex-direction:column;gap:10px;min-width:0;margin-bottom:14px}
.funnel__row{display:grid;grid-template-columns:minmax(84px,104px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.funnel__lab{color:var(--text-2);min-width:0}
.funnel__track{height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:block}
.funnel__track i{display:block;height:100%;background:var(--brand);border-radius:6px}
.funnel__val{text-align:right;font-size:13px}
.kpi-also{margin-top:var(--space-3)}
.kpi-also a{color:var(--text-2);text-decoration:underline;text-underline-offset:2px}
.attn{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--radius-md);color:var(--text);text-decoration:none;border:1px solid var(--border);background:var(--surface)}
.attn:hover{border-color:var(--brand-line);text-decoration:none}
.attn__ic{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.attn--0 .attn__ic{background:var(--danger-soft);color:var(--danger)}
.attn--1 .attn__ic{background:var(--warning-soft);color:var(--warning)}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;align-items:flex-start}
.feed li:last-child{border-bottom:0}
.feed .when{margin-left:auto;white-space:nowrap}
.listrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.listrow:last-child{border-bottom:0}
.listrow__main{min-width:0;flex:1}
.listrow__title{font-weight:600;color:var(--text);overflow-wrap:anywhere}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:var(--space-4)}
.filters .field{min-width:140px;flex:1 1 140px}
.filters .field--q{flex:2 1 260px}
.hbar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .meter{height:10px}
/* -- idea detail -- */
.comment{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.comment:last-of-type{border-bottom:0}
.comment__body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 16px}
.dl dt{color:var(--text-3);font-size:13px;font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere}
.nextstep{border-left:3px solid var(--brand);background:var(--surface-2);border-radius:var(--radius-md);padding:12px 14px}
.scorebar{display:inline-flex;gap:3px;vertical-align:middle}
.scorebar i{width:16px;height:6px;border-radius:3px;background:var(--surface-3);display:block}
.scorebar i.on{background:var(--brand)}
.idea-title{overflow-wrap:anywhere;margin:10px 0 12px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-bottom:var(--space-4);color:var(--text-2);font-size:13px}
.decision{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;background:var(--surface)}
.decision blockquote{margin:10px 0 0;padding-left:12px;border-left:2px solid var(--border-strong);color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.mini-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hide-sm{display:revert}
@media (max-width:760px){.dl{grid-template-columns:1fr;gap:2px 0}.dl dd{margin-bottom:10px}.hbar{grid-template-columns:100px 1fr 32px}.hide-sm{display:none!important}}
/* -- submit -- */
.sf-section{display:flex;flex-direction:column;gap:var(--space-4)}
.sf-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4)}
.similar{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.similar__pct{font-family:var(--font-mono);font-weight:600;color:var(--brand-ink);background:var(--brand-soft);border-radius:var(--radius-sm);padding:1px 7px}
.checklist li{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.checklist .ok{color:var(--success)} .checklist .todo{color:var(--text-3)}
.sf-details>summary{cursor:pointer;font-weight:600;padding:2px 0 10px;list-style:none;display:flex;gap:8px;align-items:center}
.sf-details>summary::-webkit-details-marker{display:none}
.sugg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--agent-border);font-size:13px}
.sugg:last-child{border-bottom:0}
.sugg__btns{display:flex;gap:4px;flex:none}
.attach-row{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:end}
@media (max-width:1100px){.layout-rail--submit aside{order:-1}.layout-rail--submit aside.sticky{position:static}}
@media (max-width:760px){.sf-grid2{grid-template-columns:1fr}.attach-row{grid-template-columns:1fr}}
.profile-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
/* -- review and pipeline -- */
.chip-link{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-weight:500;text-decoration:none;white-space:nowrap}
.chip-link:hover{background:var(--surface-2);text-decoration:none}
.chip-link[aria-current="true"]{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.chip-link .count{font-family:var(--font-mono);font-size:11px}
.rv-right{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}   /* no inner scroll: the whole page scrolls */
.layout-rail--review{grid-template-columns:minmax(0,1.2fr) minmax(360px,1fr)}
@media (max-width:1100px){.layout-rail--review{grid-template-columns:minmax(0,1fr)}}
.score-row>div:first-child{min-width:0;overflow-wrap:break-word}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.score-row:last-of-type{border-bottom:0}
.score-row .segmented span{min-width:34px;height:32px;padding:0 8px}
.decision-fields{display:flex;flex-direction:column;gap:var(--space-3);padding:12px;border-radius:var(--radius-md);background:var(--surface-2)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--space-3);align-items:start;padding-bottom:6px}
.board-cue{display:none;align-items:center;gap:6px;margin:0 0 8px;font-size:var(--fs-small)}
@media (max-width:1199px) and (min-width:761px){.board{grid-auto-columns:minmax(240px,1fr);overflow-x:auto;scroll-snap-type:x proximity;box-shadow:inset -18px 0 14px -14px rgba(0,0,0,.18)}.board__col{scroll-snap-align:start}.board-cue{display:flex}}
.board__col{background:var(--surface-2);border-radius:var(--radius-lg);padding:10px;min-height:120px;min-width:0}
.board__head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-weight:600}
.board__list{display:flex;flex-direction:column;gap:8px;max-height:680px;overflow-y:auto}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:6px;color:var(--text);text-decoration:none}
.pcard:hover{border-color:var(--brand-line);text-decoration:none}
.pcard__title{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;line-height:1.3}
.pcard .row{min-width:0}
.pcard .pill{white-space:normal;line-height:1.3;padding-top:2px;padding-bottom:2px}
.pcard--stuck{border-left:3px solid var(--danger)}
.pcard--muted{opacity:.78}
@media (max-width:760px){
  .board{grid-auto-flow:row;grid-auto-columns:auto;overflow-x:visible}
  .board__list{max-height:none}
  .table--cards thead{display:none}
  .table--cards,.table--cards tbody,.table--cards tr,.table--cards td{display:block;width:100%}
  .table--cards tr{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;padding:8px 4px}
  .table--cards td{border:0;padding:6px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .table--cards td::before{content:attr(data-label);color:var(--text-3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .table--cards .title-cell{display:block}
  .table--cards .title-cell::before{display:block;margin-bottom:2px}
}

    if (q.tag) list = list.filter(i => i.tags.includes(q.tag));

// ==== SECTION 6 TEXT ANALYSIS (agent heuristics) ====
/* Deterministic text heuristics used by the simulated agents. No language model, no network. */
const STOP = new Set('a an the and or of to in on for with is are was were be been it this that these those we our you your they their as at by from but not no can will would should could has have had do does did so if than then there here which who whom what when where why how into over under about after before more most less very just also may might must per via any each other some such only own same too out up down off again further once all both few many much new use used using one two like get got make made every still'.split(' '));
const TextAI = {
  stem(w){ if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3); if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y'; if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2); if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1); return w; },
  words(text){ return (String(text || '').toLowerCase().match(/[a-z][a-z0-9\-]{2,}/g) || []).filter(w => !STOP.has(w)); },
  /* weighted term map: title terms count double, tags count double; keeps one display word per stem */
  docOf(x){
    const terms = {}, disp = {}, add = (text, wt) => TextAI.words(text).forEach(w => { const s = TextAI.stem(w); terms[s] = (terms[s] || 0) + wt; if (!disp[s]) disp[s] = w; });
    add(x.title, 2); add(x.problem, 1); add(x.solution, 1); add((x.tags || []).join(' ').replace(/-/g, ' '), 2);
    return { terms, disp, tags:(x.tags || []) };
  },
  idfMap(){
    const docs = SEL.liveIdeas().map(i => TextAI.docOf(i)), df = {}; docs.forEach(d => Object.keys(d.terms).forEach(t => { df[t] = (df[t] || 0) + 1; }));
    const N = docs.length || 1, m = {}; Object.keys(df).forEach(t => { m[t] = Math.log(1 + N / (1 + df[t])); }); m.__default = Math.log(1 + N); return m;
  },
  /* similarity = 0.75 x weighted term overlap (idf weighted overlap coefficient) + 0.25 x tag Jaccard */
  similarity(a, b, idf){
    idf = idf || TextAI.idfMap(); const w = t => idf[t] != null ? idf[t] : idf.__default;
    let shared = [], inter = 0, sa = 0, sb = 0;
    Object.keys(a.terms).forEach(t => { sa += a.terms[t] * w(t); });
    Object.keys(b.terms).forEach(t => { sb += b.terms[t] * w(t); });
    Object.keys(a.terms).forEach(t => { if (b.terms[t]) { const s = Math.min(a.terms[t], b.terms[t]) * w(t); inter += s; shared.push({ term:a.disp[t] || t, w:s }); } });
    const overlap = Math.min(sa, sb) > 0 ? inter / Math.min(sa, sb) : 0;
    const ta = new Set(a.tags), tb = new Set(b.tags), ti = [...ta].filter(x => tb.has(x)).length, tu = new Set([...ta, ...tb]).size;
    const tagJ = tu ? ti / tu : 0;
    shared.sort((x, y) => y.w - x.w);
    return { score:clamp(0.75 * overlap + 0.25 * tagJ, 0, 0.99), shared:shared.map(s => s.term).slice(0, 5), sharedTags:[...ta].filter(x => tb.has(x)), overlap, tagJ };
  },
  similarIdeas(draft, excludeId, userId){
    const idf = TextAI.idfMap(), d = TextAI.docOf(draft), out = [];
    SEL.liveIdeas().forEach(i => {
      if (i.id === excludeId) return;
      const r = TextAI.similarity(d, TextAI.docOf(i), idf);
      if (r.score >= 0.22 && (r.shared.length + r.sharedTags.length) >= 2) out.push({ idea:i, score:r.score, shared:r.shared, sharedTags:r.sharedTags });
    });
    return out.sort((a, b) => b.score - a.score).slice(0, 3);
  },
  KEYWORDS:{
    tech:['code','api','service','services','deploy','pipeline','test','tests','infrastructure','cloud','latency','bug','sdk','ci','repository','security','database','monitoring','cache','scheduler','logging','build','merge','incident','server','schema','linter'],
    business:['customer','customers','revenue','sales','pricing','partner','partners','renewal','market','deal','deals','quote','contract','account','growth','packaging','prospect','prospects','churn','win'],
    process:['process','checklist','meeting','meetings','handoff','approval','policy','template','onboarding','review','rota','triage','expense','documentation','standardise','standardize','template','workflow','rule','guideline','calendar'],
    innovation:['agent','agents','assistant','ai','llm','model','prototype','generative','summarise','summarize','voice','predict','recommend','kompass','automatically','digest','clustering','copilot','chatbot']
  },
  suggestCategory(d){
    const text = ' ' + TextAI.words((d.title || '') + ' ' + (d.problem || '') + ' ' + (d.solution || '')).join(' ') + ' ', scores = {}, ev = {};
    Object.keys(TextAI.KEYWORDS).forEach(c => { scores[c] = 0; ev[c] = []; TextAI.KEYWORDS[c].forEach(k => { const m = text.split(' ' + k + ' ').length - 1; if (m) { scores[c] += m; ev[c].push(k); } }); });
    const ranked = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
    if (scores[ranked[0]] < 2 || scores[ranked[0]] - scores[ranked[1]] < 1) return null;
    return { value:ranked[0], evidence:uniq(ev[ranked[0]]).slice(0, 4), confidence:clamp((scores[ranked[0]] - scores[ranked[1]]) / Math.max(3, scores[ranked[0]]), 0.1, 0.95) };
  },
  TAG_SYNONYMS:{
    'ci-cd':['pipeline','deploy','release','build','merge','ci','cd','hotfix'], testing:['test','tests','flaky','qa','regression','linter'], automation:['automate','automatic','automatically','bot','script','scheduled','scheduler','auto'],
    observability:['monitoring','logging','trace','traces','alert','alerts','observability','incident','metrics'], docs:['documentation','docs','runbook','wiki','writing','notes','template','handbook'],
    cost:['cost','spend','cloud','budget','saving','savings','expensive'], performance:['latency','slow','performance','speed','load','faster'], security:['security','secret','secrets','vulnerability','access','permissions','privacy'],
    agents:['agent','agents','assistant','llm','prompt','model','ai','kompass'], support:['support','ticket','tickets','escalation','helpdesk','customer'], onboarding:['onboarding','newcomer','joiner','joiners','buddy','hire'],
    analytics:['analytics','dashboard','insight','insights','report','reporting','metric'], 'customer-feedback':['feedback','survey','voice','requests','interview'], 'sales-enablement':['sales','quote','pitch','prospect','deal','deals'],
    partners:['partner','partners','co-marketing','referral'], pricing:['pricing','price','tier','tiers','discount','quote'], meetings:['meeting','meetings','calendar','agenda'], compliance:['compliance','audit','policy','severity','regulated'],
    accessibility:['accessibility','a11y','screen','contrast'], 'design-system':['design','token','tokens','component','components','figma'], 'knowledge-base':['knowledge','article','articles','help','centre','center'],
    integrations:['integration','integrations','connector','connectors','api','sdk','webhook'], reporting:['report','reporting','spreadsheet','export'], templates:['template','templates','gallery','checklist']
  },
  suggestTags(d, taken){
    const text = ' ' + TextAI.words((d.title || '') + ' ' + (d.problem || '') + ' ' + (d.solution || '')).join(' ') + ' ', out = [];
    Object.keys(TextAI.TAG_SYNONYMS).forEach(tag => { if ((taken || []).includes(tag)) return; const hit = TextAI.TAG_SYNONYMS[tag].filter(k => text.includes(' ' + k + ' ')); if (hit.length) out.push({ tag, score:hit.length, terms:hit.slice(0, 3) }); });
    return out.sort((a, b) => b.score - a.score || a.tag.localeCompare(b.tag)).slice(0, 5);
  },
  hasNumber(s){ return /\d/.test(String(s || '')); },
  completeness(d){
    const L = x => String(x || '').trim().length, items = [
      { id:'category', label:'Category chosen', ok:!!d.categoryId },
      { id:'title', label:'Clear title (8+ characters)', ok:L(d.title) >= 8 },
      { id:'problem', label:'Problem described, with a number', ok:L(d.problem) >= 40 && TextAI.hasNumber(d.problem) },
      { id:'solution', label:'Proposed solution described', ok:L(d.solution) >= 40 },
      { id:'beneficiaries', label:'Beneficiaries named', ok:L(d.beneficiaries) >= 3 },
      { id:'effort', label:'Rough effort picked', ok:!!d.effort },
      { id:'success', label:'Success measured with a number', ok:L(d.success) >= 15 && TextAI.hasNumber(d.success) },
      { id:'tags', label:'At least one tag', ok:(d.tags || []).length > 0 }
    ];
    return { items, done:items.filter(x => x.ok).length, total:items.length };
  },
  enhancements(d){
    const out = [], cat = CATEGORY_HELP[d.categoryId]; if (!cat) return out;
    const L = x => String(x || '').trim().length;
    if (L(d.problem) > 0 && !TextAI.hasNumber(d.problem)) out.push({ id:'problem-number', kind:'problem', field:'problem', text:'Quantify the problem: how many people, hours or tickets a month does it affect?', insert:'Today this affects [how many people] and costs about [hours or dollars] per month.', hint:cat.problem });
    if (/\b(we should|we need to build|build a|create a|add a|implement a)\b/i.test(d.problem || '')) out.push({ id:'problem-solution-first', kind:'problem', field:'problem', text:'This problem statement reads like a solution. Say who is affected and what goes wrong, then keep the fix for the next field.', insert:'As [who is affected], [what goes wrong] costs [metric].', hint:'' });
    const emptySuccess = L(d.success) < 15 || !TextAI.hasNumber(d.success);
    if (emptySuccess) cat.metrics.forEach((m, i) => out.push({ id:'metric-' + i, kind:'metric', field:'success', text:'Measure success with: ' + m, insert:m + ': from [today] to [target]', hint:'' }));
    if (L(d.beneficiaries) < 10) cat.beneficiaries.forEach((b, i) => out.push({ id:'benef-' + i, kind:'beneficiary', field:'beneficiaries', text:'Likely beneficiaries: ' + b, insert:b, hint:'' }));
    return out.slice(0, 7);
  },
  /* ---- extractive discussion summary: real comment sentences, bucketed by cue words ---- */
  sentences(text){ return String(text || '').replace(/\s+/g, ' ').match(/[^.!?]+[.!?]?/g) || []; },
  discussion(ideaId){
    const idea = SEL.idea(ideaId), pros = [], concerns = [], questions = [];
    const cue = { concern:/\b(concern|risk|worry|worried|depends|dependency|blocked|careful|overlap|optimistic|however|security|privacy|slow|hide|graveyard|skipped|heavy|paperwork|expire)\b/i, support:/(\+1|\bagree|\blove\b|\bwould use|strong|keen|would help|helpful|\bneed\b|same problem|glad|nice|great|would save|ends? that|stop quotes)/i, suggest:/\b(suggestion|might help|could we|add a|start with|pilot)\b/i };
    SEL.comments(ideaId).forEach(c => {
      const who = SEL.personRef(c.authorId, idea).label;
      TextAI.sentences(c.body).map(s => s.trim()).filter(s => s.length > 12).forEach(s => {
        const rec = { text:s, who, at:c.at };
        if (/\?\s*$/.test(s) || /^question\b/i.test(s)) questions.push(rec); else if (cue.concern.test(s)) concerns.push(rec); else if (cue.support.test(s) || cue.suggest.test(s)) pros.push(rec);
      });
    });
    return { pros:pros.slice(0, 2), concerns:concerns.slice(0, 3), questions:questions.slice(0, 3), total:SEL.commentCount(ideaId) };
  }
};

// ==== SECTION 8 MOCK AGENT ENGINE ====

/* Views never touch the store or the engine directly. They act through api.* and AgentGateway.run(), which return Promises

  /* run(agentName, event, context, opts) -> Promise<AgentRun>. opts.record persists the run to the activity log. */
  run(agentName, event, context, opts){
    opts = opts || {};
    return MockEngine.run(agentName, event, context || {}, opts).then(run => { if (opts.record) Store.dispatch('agent.recordRun', { run:Object.assign({}, run, { output:{ summary:run.output.summary } }) }); return run; });
  }
};

function auditHandlers(){

function selfCheck(){
  const E = S().ent, bad = [], ref = (kind, id, set) => { if (id && !set[id]) bad.push(kind + ' -> missing ' + id); };

    const hist = SEL.history(i.id); if (!hist.length) bad.push('idea ' + i.id + ' has no status history'); else if (hist[hist.length - 1].to !== i.status) bad.push('idea ' + i.id + ' status ' + i.status + ' differs from last history ' + hist[hist.length - 1].to);
    ref('idea ' + i.id + ' author', i.authorId, E.users); ref('idea ' + i.id + ' owner', i.ownerId, E.users); ref('idea ' + i.id + ' category', i.categoryId, E.categories); ref('idea ' + i.id + ' mergedInto', i.mergedIntoId, E.ideas);
    i.coAuthorIds.forEach(u => ref('idea ' + i.id + ' coauthor', u, E.users));
    if (i.status === 'accepted' && !i.ownerId && !i.awaitingOwner) bad.push('idea ' + i.id + ' accepted without owner or awaitingOwner');
    if (i.status === 'parked' && !i.revisitAt) bad.push('idea ' + i.id + ' parked without revisit date');
    if (DECISION_STATUSES.includes(i.status) || i.status === 'prototype' || i.status === 'implemented') { if (!SEL.latestDecision(i.id)) bad.push('idea ' + i.id + ' has no decision record'); else if (SEL.latestDecision(i.id).reason.length < 20) bad.push('idea ' + i.id + ' decision reason too short'); }
  });
  ['comments','volunteers','votes','follows','decisions','reviews','history','activity'].forEach(k => Object.values(E[k]).forEach(r => ref(k + ' ' + r.id + ' idea', r.ideaId, E.ideas)));
  Object.values(E.notifications).forEach(n => ref('notification ' + n.id + ' user', n.userId, E.users));
  Object.values(E.agentRuns).forEach(r => { if (!r.simulated) bad.push('run ' + r.id + ' not marked simulated'); });

}
